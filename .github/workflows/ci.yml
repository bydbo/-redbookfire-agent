name: CI

# 推送 main 与 PR 都跑；也支持在 Actions 页面手动触发（S4.5）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上的新推送取消旧跑，省时间也省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 所有 uv 命令都要求锁文件是最新的（与本地 pre-commit 同一口径：靠 uv.lock 而不是现场解析）
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"          # 与镜像里钉的 uv 版本一致
          python-version: "3.12"     # 项目基线（requires-python >= 3.11）
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run ruff check .

  typecheck:
    name: typecheck（mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run mypy

  test:
    name: test（pytest 单测 + 集成 + 覆盖率门槛）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      # 单测 + 覆盖率门槛（fail_under 写在 pyproject 的 [tool.coverage.report] 里）
      - run: uv run pytest -q --cov --cov-report=term-missing
      # 集成用例：GitHub runner 自带 Docker，testcontainers 直接起真 Postgres / Redis
      - run: uv run pytest -m integration -q

  image:
    name: image（Dockerfile + compose 静态校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # compose 文件结构 + 应用镜像能否构建（runner 直连 docker.io，不受本机镜像站限制）
      - run: docker compose config --quiet
      - run: docker build -t xhs-agent:ci .

  frontend:
    name: frontend（契约类型生成 + 防漂移校验，S5.2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # 官方推荐顺序：先装 pnpm，setup-node 的 cache: pnpm 才能命中
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "11.25.0"           # 与 package.json 的 packageManager 一致
          run_install: false           # 安装单独一步，命令在日志里更醒目
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "25.3.0"       # 与 frontend/.node-version / engines 一致
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # --frozen-lockfile 对齐 Python 侧的 UV_FROZEN=1：锁文件是事实，不现场解析
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # 重新生成 schema.d.ts 并比对入库副本：openapi.yaml 改了而类型没重新生成提交 → 红
      - run: pnpm run check:api
        working-directory: frontend
