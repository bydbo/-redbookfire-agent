name: CI

# 推送 main 与 PR 都跑；也支持在 Actions 页面手动触发（S4.5）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上的新推送取消旧跑，省时间也省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 所有 uv 命令都要求锁文件是最新的（与本地 pre-commit 同一口径：靠 uv.lock 而不是现场解析）
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"          # 与镜像里钉的 uv 版本一致
          python-version: "3.12"     # 项目基线（requires-python >= 3.11）
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run ruff check .

  typecheck:
    name: typecheck（mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run mypy

  test:
    name: test（pytest 单测 + 集成 + 覆盖率门槛）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      # 单测 + 覆盖率门槛（fail_under 写在 pyproject 的 [tool.coverage.report] 里）
      - run: uv run pytest -q --cov --cov-report=term-missing
      # 集成用例：GitHub runner 自带 Docker，testcontainers 直接起真 Postgres / Redis
      - run: uv run pytest -m integration -q

  image:
    name: image（Dockerfile + compose 静态校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # compose 文件结构 + 应用镜像能否构建（runner 直连 docker.io，不受本机镜像站限制）
      - run: docker compose config --quiet
      - run: docker build -t xhs-agent:ci .
