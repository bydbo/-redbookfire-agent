openapi: 3.1.0

info:
  title: 小红书热点搭子 · 热点相关性 API
  version: 0.1.0
  summary: 输入热点，在本地素材库中检索可蹭素材并产出文案初稿
  description: |
    ## 本文件的地位

    本文件是 API 的**唯一事实源**。代码向契约对齐；改接口必须先改本文件，
    再改实现，并通过 CI 中的契约一致性校验（见 docs/backlog.md 的 S4.6）。

    ## 设计前提

    - **本地单人工具**：不提供鉴权、不区分用户、不做限流。此处写"不适用"而非留空，
      是为了让面试追问时能给出明确答案，而不是"还没来得及做"。
    - **不做运行时降级**：依赖不可用时返回错误码，不返回降级结果。
    - **分析是异步任务**：`POST /api/analyze` 立即返回 `job_id`，进度与结果分开查询。
    - **API 统一 `/api` 前缀**（见 ADR 0009）：根路径与其余非 `/api` 路径全部交给前端单页应用，
      前端路由与 API 路径互不干扰。
    - **前端不在本契约内**：单页应用的构建产物由服务端静态挂载，技术栈见 `docs/技术栈.md`。

    ## 通用约定

    - 字段名一律 snake_case；时间戳为 RFC 3339（UTC）。
    - 除报告接口外，响应体均为 `application/json`。
    - 请求可携带 `X-Request-ID`，响应同值回写；未携带时由服务端生成，并贯穿日志与调用追踪。
    - `topk` 默认 5，允许范围 1–20；`hotspots` 允许 1–10 条。

    ## 错误码

    | code | HTTP | 含义 |
    | --- | --- | --- |
    | `bad_request` | 400 | 请求格式或参数不合法 |
    | `validation_error` | 422 | 字段级校验失败（如 topk 越界） |
    | `not_found` | 404 | job_id 或 run_id 不存在 |
    | `conflict` | 409 | 当前状态不允许该操作（如运行尚未完成就取结果） |
    | `payload_too_large` | 413 | 请求体超过体积上限（如上传超过 `[upload].max_size_gb`） |
    | `dependency_unavailable` | 503 | 数据库或 Redis 不可用，或模型配置缺失 |
    | `upstream_error` | 502 | 上游模型返回错误或连续重试失败 |
    | `internal_error` | 500 | 未分类的内部错误 |
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地与演示环境。API 统一挂载在 /api 前缀下；根路径与前端路由由单页应用处理（见 ADR 0009）。
security: []
tags:
  - name: 分析
    description: 提交热点并跟踪任务
  - name: 结果
    description: 读取运行结果与报告
  - name: 素材
    description: 浏览、整理与导入本地素材库
  - name: 对话
    description: 对话式入口：会话、消息与流式回复
  - name: 运维
    description: 健康检查

paths:
  /api/health:
    get:
      tags:
        - 运维
      summary: 健康检查
      description: 逐项返回探测结果——数据库与 Redis 是**真实连接探测**；llm 项只校验**配置就绪性**（不发真实请求：会烧钱，也容易被网络抖动误判，与 probe.py 的口径一致）。任一不可用时整体状态为 down 并返回 503。
      operationId: getHealth
      responses:
        '200':
          description: 全部依赖可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 存在不可用依赖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/analyze:
    post:
      tags:
        - 分析
      summary: 提交热点分析任务
      description: |
        接受一个或多个热点文本，落库生成 hotspot 与 run 记录，投递异步任务后立即返回。
        同一请求内多个热点按顺序分别分析，互不影响。
      operationId: createAnalysis
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '202':
          description: 任务已接受
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/hotspots/image-clue:
    post:
      tags:
        - 分析
      summary: 从图片拆解热点线索
      description: |
        上传一张热点图片（jpg / png / webp，单张，≤ 10 MB），由多模态模型拆成「热点描述 + 爆点要素」。
        图片**只在内存里转成模型输入**——不落盘、不入库；与素材上传是两条独立链路。
        解析结果同样不落库：用户确认（可编辑）后随 `POST /api/analyze` 的 `clues` 字段一起提交。
        该接口**不要求 ffmpeg**（图片不抽帧）：只要求 `[vision].enabled = true` 与密钥。
      operationId: createImageClue
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 单张图片（jpg / png / webp，≤ 10 MB）
      responses:
        '200':
          description: 解析结果（未落库，供用户确认后随 clues 提交）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageClueResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/jobs/{job_id}:
    get:
      tags:
        - 分析
      summary: 查询任务状态
      description: 轮询任务进度；succeeded 后可凭 run_id 取结果，failed 时 error 字段给出失败原因。
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs:
    get:
      tags:
        - 结果
      summary: 列出历史运行
      description: 按创建时间倒序分页返回历史运行摘要（run_id、状态、热点数与首条热点预览、成本与耗时）。
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 历史运行列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs/{run_id}:
    get:
      tags:
        - 结果
      summary: 读取运行结果
      description: 返回该次运行的结构化结果：线索、候选素材、覆盖缺口与文稿。
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 运行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs/{run_id}/report:
    get:
      tags:
        - 结果
      summary: 读取报告
      description: 返回渲染好的报告；html 为自带样式的单文件，md 为可直接复制的文本。
      operationId: getRunReport
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - html
              - md
            default: html
      responses:
        '200':
          description: 报告内容
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/materials/{material_id}/keyframes/{index}:
    get:
      tags:
        - 结果
      summary: 读取素材关键帧图片
      description: |
        返回候选素材登记的关键帧图片（JPEG），供结果详情页缩略图使用。
        帧路径来自素材库的关键帧缓存目录；素材不存在、下标越界或文件缺失一律 404，
        不区分原因（避免暴露素材库内部布局）。
      operationId: getMaterialKeyframe
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 关键帧图片（JPEG）
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials:
    get:
      tags:
        - 素材
      summary: 列出素材库
      description: |
        按索引时间倒序分页返回素材库；支持关键词（标题或标签的子串）、类型、打标来源与
        主题目录筛选。`dirs` 是**直接子目录**的计数（受 `q` / `type` / `source` 影响、
        不受 `dir` 影响），供前端渲染主题导航。磁盘目录是唯一来源，这里是索引副本。
      operationId: listMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          required: false
          description: 关键词；匹配标题或任一标签（大小写不敏感的子串，去空白后为空即忽略）
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: 素材类型
          schema:
            type: string
            enum:
              - video
              - image
        - name: source
          in: query
          required: false
          description: 打标来源
          schema:
            type: string
            enum:
              - sidecar
              - vision
              - filename
              - legacy
        - name: dir
          in: query
          required: false
          description: |
            主题目录（相对素材根目录的路径，正斜杠）；空串表示只看直接放在根目录下的素材，
            非空时按前缀匹配（含子目录）。不传 = 全部。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 素材列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/scan:
    post:
      tags:
        - 素材
      summary: 触发素材库扫描
      description: |
        投递一次「增量同步 + 向量回填」：扫描 `<素材根>` 下新增 / 变更 / 消失的文件并落库，
        再给缺向量的素材补齐 `embedding`。素材目录不存在时任务以 FAILURE 结束（不做降级）。
        进度与失败原因用 `GET /api/materials/tasks/{task_id}` 查。
      operationId: scanMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: 已受理索引任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTaskAccepted'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/uploads:
    post:
      tags:
        - 素材
      summary: 上传素材
      description: |
        流式接收**单个**媒体文件，落到 `<素材根>/<YYYY-MM>/`（同名自动加 `-2` 序号，不覆盖），
        随后投递索引任务（抽帧 + 打标 + 向量回填）。
        扩展名必须在 `[upload].allowed_extensions` 里（否则 400）；体积上限 `[upload].max_size_gb`
        （超限 413，边写边计并清理临时文件）；空文件 400。
        文件先写 `.incoming-*.part` 再原子改名，失败不会在素材目录里留下半截文件。
      operationId: uploadMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: 文件已落盘并受理索引任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialUploadAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/tasks/{task_id}:
    get:
      tags:
        - 素材
      summary: 查询素材索引任务
      description: |
        读任务状态：`state` 是 Celery 的标准五态，`step` 是当前阶段（扫描素材目录 / 向量回填），
        `summary` 是成功时的一句话摘要或失败时的异常串（截断 500 字，不含密钥），
        `result` 是成功时的计数 dict。**未知或已过期的 `task_id` 返回 200 + `PENDING`**
        （结果键的 TTL 是 1 小时：进度是临时的，素材本身以磁盘与数据库为准）。
      operationId: getMaterialTask
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTask'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/trash:
    get:
      tags:
        - 素材
      summary: 列出回收站
      description: |
        递归扫 `<素材根>/_trash/`，返回里面的媒体文件（旁车跟着媒体走，不单独列出）。
        `_trash` 是回收站目录：扫描素材库时跳过它，所以「移进来」就等于出库。
      operationId: listTrashedMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 回收站内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/trash/restore:
    post:
      tags:
        - 素材
      summary: 从回收站恢复
      description: |
        把回收站里的一条（连同它的旁车）移回素材目录的**原相对路径**，并触发一次索引任务。
        **恢复等于重新入库**：新 uuid、重新打标；移入回收站时 `run_matches` 已被外键级联清理，
        历史候选不会回来。目标位置已有同名文件 → 409。
      operationId: restoreMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashRestoreRequest'
      responses:
        '202':
          description: 已恢复并受理索引任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 目标位置已有同名文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/trash/purge:
    post:
      tags:
        - 素材
      summary: 真删回收站里的文件
      description: |
        真删（不可恢复）：`paths` 给具体条目（连同旁车一起删），`all=true` 清空整个回收站；
        两者二选一必填，且 `confirm` 必须为 `true`（二次确认）。先整体校验再删，
        任何一条不在回收站里就 404，不做部分删除。
      operationId: purgeTrashedMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashPurgeRequest'
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashPurgeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/{material_id}:
    get:
      tags:
        - 素材
      summary: 读取素材详情
      description: 返回单个素材的完整索引信息（含爆点要素 `elements`）；非法或未知 id 一律 404。
      operationId: getMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    patch:
      tags:
        - 素材
      summary: 修改素材元数据
      description: |
        只接受 `title` / `tags` / `description`（白名单，其余字段一律 422 拒绝而不是静默忽略），
        且至少要给一个字段（否则 400）。写入落两处：先写同名旁车 `<素材文件名>.txt`
        （`标题: …` / `标签: a, b` / `描述: …`），再更新 `materials` 行——磁盘目录始终是
        唯一来源，重扫描会得到同一份事实。三个字段的值都没变时不写文件。
        标签会去空白、去 `#` 前缀并去重；去重后最多 14 个、单个标签最多 24 字（超出 400）。
        标题与描述按**单行**处理（换行折成空格），因为旁车是 `键: 值` 行格式。
      operationId: updateMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialRequest'
      responses:
        '200':
          description: 更新后的素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/{material_id}/trash:
    post:
      tags:
        - 素材
      summary: 把素材移进回收站
      description: |
        把素材（连同它的 `.txt` / `.md` / `.json` 旁车）移到 `<素材根>/_trash/<原相对路径>`，
        并删掉索引行；回收站里已有同名时自动加 `-2` 序号，不覆盖。
        删行会让 `run_matches` 通过外键级联清理——**历史候选不再回来**（恢复 = 重新入库，
        新 uuid）。磁盘上文件已不在时仍然删行，响应里 `file_missing=true`。
      operationId: trashMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 移入回收站的结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTrashResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions:
    post:
      tags:
        - 对话
      summary: 新建对话会话
      description: |
        建一个空会话（前端「新对话」）。标题留空，等**首条用户消息**落库时取前 20 字自动补上；
        会话与消息只在本机数据库里，附件落在 `runs/_chat/<session_id>/`。
      operationId: createChatSession
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    get:
      tags:
        - 对话
      summary: 列出对话会话
      description: 按最近活跃（`updated_at`）倒序分页；每项带消息数与末条消息预览（超 60 字截断）。
      operationId: listChatSessions
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}:
    get:
      tags:
        - 对话
      summary: 读取会话与消息
      description: |
        返回会话与它的消息（按时间升序）。`status=running` 的 assistant 消息代表"这一轮还没跑完"，
        前端刷新后用轮询补齐；超过 `[chat].turn_stale_seconds` 仍未收尾的会被标成 `interrupted`。
      operationId: getChatSession
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 只取最近 N 条消息（不传 = 全部）
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

    delete:
      tags:
        - 对话
      summary: 删除会话
      description: |
        删除会话及其级联数据（消息、状态、审计、版本、缓存、观测），并清理**该会话附件根内**
        的文件（v2 §3.3D）。文件清理失败记录原因但不恢复会话；不存在返回 404。
      operationId: deleteChatSession
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已删除
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/messages:
    post:
      tags:
        - 对话
      summary: 发一条消息（SSE 流式）
      description: |
        一次 multipart 请求带上文字与（可选的）**一组图片**（1–9 张，同属一组），返回
        `text/event-stream`：
        `turn_started` → （可选）`stage` / `tool_started` / `tool_progress` / `tool_finished` →
        `text_delta`（真 token 增量）→ `turn_finished`（带 run_id）；失败则发一条 `error`
        并结束这一轮。每一行 `data:` 是一个 JSON 对象。
        **事件字段只增不减**（S7.19–S7.21）：全部事件带 `turn_id`；`tool_started` 带
        `call_id` / `attempt` / `started_at`；`tool_progress` 另带 `stage_key` / `status` /
        `updated_at` / `elapsed_ms`；`tool_finished` 带 `call_id` / `ended_at` /
        `error_category`；`turn_finished` 带 `trace_id` / `last_finished_stage`；`error` 带
        `stage` / `error_category` / `trace_id`；新增的 `stage` 事件带 `message_id` / `stage` /
        `label` / `status` / `attempt` / `run_id` / `job_id` / `last_finished_stage` 等阶段
        快照字段。
        **权威快照（E7OBS4-04）**：`stage`、需要更新阶段的 `tool_progress` / `tool_finished`，
        以及成功 / 失败 / 取消的终端事件，另带**合并后的 `progress`**（`StageInfo`）与
        `progress_revision`，事件信封带 `message_id` / `turn_id`。客户端取得 `progress` 后
        **只投影一次**，不得再用原始 `stage_key` 自拼当前阶段；原始 `stage` / `done` / `total`
        仅用于工具过程列表。`progress_revision` 只在同一 `(message_id, turn_id)` 范围内可比，
        无 `progress` 的旧格式事件不能覆盖已有的较新快照。
        **断开浏览器只停转发**：这一轮照常跑完并落库（库里能看到 assistant 消息的终态）。
        图片只接受 jpg / png / webp（按 magic bytes）；单张上限 `[chat].attachment_max_mb`、
        数量上限 `[chat].attachment_max_count`、合计上限 `[chat].attachment_total_max_mb`——
        超数量或超总量**整批拒绝**（400，不静默截断），400 文案指明是第几张。
      operationId: postChatMessage
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: 用户这条消息的文字（与图片至少给一个）
                files:
                  type: array
                  items:
                    type: string
                  description: 可选的热点图片（jpg / png / webp），一次 1–9 张，同属一组
                operation_binding:
                  type: string
                  description: 可选的结构化操作绑定 JSON（v2 §3.3B）：{operation, object_key, base_version_id, expected_state_version, force_reparse}
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/attachments/{message_id}/{index}:
    get:
      tags:
        - 对话
      summary: 读取会话里的附件
      description: |
        按会话 + 消息 + 下标取回附件原图（回看历史会话时用）。消息不属于该会话、下标越界、
        文件缺失一律 404，不区分原因（与关键帧接口同一口径，避免暴露内部布局）。
      operationId: getChatAttachment
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 附件图片
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/context:
    get:
      tags:
        - 对话
      summary: 读取会话的上下文状态
      description: |
        返回会话的结构化上下文（S7.24）：生效事实、待确认提案、状态版本、话题、恢复状态与产物 head。
        `effective_mode` 是**运行时实际生效**的模式（`enforce` 在模型窗口未核实时降级为 `shadow`）；
        `recovery_status=partial` 表示旧会话历史不完整，前端应显示「历史状态未完整恢复」。
        状态版本用于前端提交动作时做 CAS（`expected_state_version`），过期即 409。
      operationId: getChatContext
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 会话上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatContext'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/context/actions:
    post:
      tags:
        - 对话
      summary: 对上下文事实执行确认 / 拒绝 / 撤回 / 替换 / 切换话题
      description: |
        用户动作（S7.24）：`confirm` / `reject` 针对具体 `target_id`（事实或提案），`retract`
        撤回生效事实，`replace` 用 `value` 显式替换，`reset_topic` 归档当前话题的有效项并新开话题。
        **必须带 `expected_state_version`**：与服务端当前版本不一致返回 409（响应里给当前版本，
        前端刷新后重新操作），同一版本重复提交不会再次推进状态。
      operationId: postChatContextAction
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextActionRequest'
      responses:
        '200':
          description: 动作结果与最新上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态版本冲突（响应带当前版本，可重试）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/artifacts:
    get:
      tags:
        - 对话
      summary: 列出版本与基础版本
      description: |
        按对象列出版本（S7.25）；不传 `object_key` 时列出本会话全部对象的最新成功版本。
        **只返回本会话的版本**——跨会话一律 404 / 空列表，不靠前端隐藏选项。
      operationId: listChatArtifacts
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: object_key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersionList'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/artifacts/clue-versions:
    post:
      tags:
        - 对话
      summary: 保存用户编辑的线索版本
      description: |
        线索编辑是独立不可变业务版本（v2 §3.3C）：保存完整合法线索、基础版本与来源，
        成功后设为选定引用；同 action_id 重放返回原结果。已有选定编辑版不会被旧缓存覆盖。
      operationId: createClueVersion
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClueVersionRequest'
      responses:
        '200':
          description: 动作结果与最新上下文（重放或成功）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/artifacts/{version_id}/select:
    post:
      tags:
        - 对话
      summary: 选定一个线索版本
      description: |
        只选同会话成功 clue 版本（v2 §3.3C）；推进状态版本并写用户动作审计。
        重解析产生的原始版本不改变已有选定编辑版，只有显式 select 才切换。
      operationId: selectClueVersion
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClueSelectRequest'
      responses:
        '200':
          description: 动作结果与最新上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态版本冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/artifacts/{version_id}:
    get:
      tags:
        - 对话
      summary: 读取指定的不可变版本
      description: |
        取指定版本及它的来源、基础版本与用量（S7.25）。版本不属于该会话一律 404。
      operationId: getChatArtifact
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 版本内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 客户端生成的请求标识；未提供时由服务端生成。用于贯穿日志、调用追踪与数据库记录。
      schema:
        type: string
        maxLength: 128

  headers:
    RequestId:
      description: 本次请求的标识
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求格式或参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 字段级校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: 依赖不可用（不做降级，直接返回错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 请求体超过体积上限（上传超过 `[upload].max_size_gb`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: 上游服务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - hotspots
      properties:
        hotspots:
          type: array
          minItems: 1
          maxItems: 10
          description: 热点文本列表（话题句或链接文本均可）
          items:
            type: string
            minLength: 1
            maxLength: 500
        topk:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: 每个热点返回的候选素材数量上限
        clues:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            预设线索快照（S6.7）：与 hotspots **一一对应、等长**；某一项为 null 表示该热点走正常拆解。
            非空的那一项会写进对应 hotspots 行的 clue 并**短路拆解节点**（用户确认/编辑过的标签原样生效，
            不重复付费）。不传时行为与不带该字段完全一致。
          items:
            oneOf:
              - $ref: '#/components/schemas/HotspotClue'
              - type: 'null'

    AnalyzeAccepted:
      type: object
      required:
        - job_id
        - run_id
      properties:
        job_id:
          type: string
          description: 异步任务标识，用于轮询状态
        run_id:
          type: string
          format: uuid
          description: 运行记录标识，用于读取结果与报告

    ImageClueResult:
      type: object
      required:
        - raw_text
        - clue
        - prompt_versions
      properties:
        raw_text:
          type: string
          description: 模型给出的热点描述（≤ 500 字）；用户可编辑后作为 hotspots 提交
        clue:
          $ref: '#/components/schemas/HotspotClue'
        prompt_versions:
          type: object
          description: '本次解析实际使用的 prompt 版本，如 {"image_hotspot_clue": 1}'
          additionalProperties:
            type: integer

    JobStatus:
      type: object
      required:
        - job_id
        - run_id
        - status
        - progress
      properties:
        job_id:
          type: string
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: 0–1 的完成比例
        current_step:
          type: string
          description: 当前阶段的中文标签（素材同步 / 向量回填 / 拆解 / 检索 / 缺口 / 撰稿 / 报告）；未开始或已收尾为空
        stage:
          oneOf:
            - $ref: '#/components/schemas/StageInfo'
            - type: 'null'
          description: 当前阶段快照（S7.20）；`current_step` 是它的 `label` 投影
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'

    RunSummary:
      type: object
      required:
        - run_id
        - status
        - created_at
        - hotspot_count
        - hotspot_preview
        - topk
        - totals
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        hotspot_count:
          type: integer
          minimum: 0
        hotspot_preview:
          type: string
          description: 第一条热点的原文预览（超过 60 字截断加省略号）
        topk:
          type: integer
          minimum: 1
          maximum: 20
        totals:
          $ref: '#/components/schemas/RunTotals'
        error:
          oneOf:
            - type: string
            - type: 'null'

    RunList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total:
          type: integer
          minimum: 0

    RunDetail:
      type: object
      required:
