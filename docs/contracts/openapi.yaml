          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        keyframes:
          type: array
          items:
            type: string

    MaterialItem:
      type: object
      description: 素材库列表里的一条素材（磁盘目录是唯一来源，这里是索引副本）。
      required:
        - id
        - path
        - type
        - title
        - description
        - tags
        - duration_s
        - width
        - height
        - has_audio
        - size_bytes
        - source
        - keyframes
        - indexed_at
        - dir
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: 素材绝对路径
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        size_bytes:
          type: integer
        source:
          type: string
          enum:
            - sidecar
            - vision
            - filename
            - legacy
        keyframes:
          type: array
          items:
            type: string
        indexed_at:
          type: string
          format: date-time
        dir:
          type: string
          description: 相对素材根目录的父目录（正斜杠；直接放在根目录下时为空串），供前端显示主题

    MaterialDetail:
      type: object
      description: 素材详情：列表项的全部字段 + 爆点要素。
      required:
        - id
        - path
        - type
        - title
        - description
        - tags
        - duration_s
        - width
        - height
        - has_audio
        - size_bytes
        - source
        - keyframes
        - indexed_at
        - dir
        - elements
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: 素材绝对路径
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        size_bytes:
          type: integer
        source:
          type: string
          enum:
            - sidecar
            - vision
            - filename
            - legacy
        keyframes:
          type: array
          items:
            type: string
        indexed_at:
          type: string
          format: date-time
        dir:
          type: string
          description: 相对素材根目录的父目录（正斜杠；直接放在根目录下时为空串），供前端显示主题
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'

    MaterialTrashResult:
      type: object
      description: 把一个素材移进回收站的结果。
      required:
        - material_id
        - path
        - trashed_path
        - file_missing
      properties:
        material_id:
          type: string
          format: uuid
        path:
          type: string
          description: 移入前的相对路径（原样，不带序号）
        trashed_path:
          type: string
          description: 回收站里的相对路径（同名时带 `-2` 序号）
        file_missing:
          type: boolean
          description: 磁盘上本来就没有这个文件（只删了索引行）

    TrashItem:
      type: object
      description: 回收站里的一条素材（旁车跟着媒体走，不单独列出）。
      required:
        - path
        - name
        - type
        - size_bytes
        - mtime
      properties:
        path:
          type: string
          description: 相对 `_trash/` 的路径（正斜杠）
        name:
          type: string
        type:
          type: string
          enum:
            - video
            - image
        size_bytes:
          type: integer
          minimum: 0
        mtime:
          type: string
          format: date-time

    TrashList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashItem'
        total:
          type: integer
          minimum: 0

    TrashRestoreRequest:
      type: object
      description: 恢复请求：`path` 是回收站里的相对路径（正斜杠，越界一律 400）。
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string

    TrashPurgeRequest:
      type: object
      description: |
        真删请求：`paths` 与 `all=true` 二选一必填，且 `confirm` 必须为 `true`（二次确认）。
        违反其中任一条都是 400。
      additionalProperties: false
      properties:
        paths:
          type: array
          items:
            type: string
        all:
          type: boolean
        confirm:
          type: boolean

    TrashPurgeResult:
      type: object
      required:
        - deleted
        - count
      properties:
        deleted:
          type: array
          description: 真删掉的相对路径（含跟随媒体一起删的旁车）
          items:
            type: string
        count:
          type: integer
          minimum: 0

    MaterialTaskAccepted:
      type: object
      description: 素材索引任务已受理；`task_id` 用于 `GET /api/materials/tasks/{task_id}`。
      required:
        - task_id
      properties:
        task_id:
          type: string

    MaterialUploadAccepted:
      type: object
      description: 上传受理结果：文件已落盘，索引任务已投递。
      required:
        - task_id
        - path
        - name
      properties:
        task_id:
          type: string
        path:
          type: string
          description: 相对素材根目录的正斜杠路径（`<YYYY-MM>/名称.mp4`）
        name:
          type: string
          description: 实际落盘的文件名（同名时带 `-2` 序号）

    ChatSessionCreate:
      type: object
      description: 建会话请求体；可以不传（标题留空，等首条用户消息自动补）。
      additionalProperties: false
      properties:
        title:
          type: string

    ChatSession:
      type: object
      required:
        - session_id
        - title
        - created_at
        - updated_at
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
          description: 取首条用户消息前 20 字；未发言时为「新对话」，不可编辑
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatSessionSummary:
      type: object
      required:
        - session_id
        - title
        - created_at
        - updated_at
        - message_count
        - last_message_preview
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer
          minimum: 0
        last_message_preview:
          type: string
          description: 末条消息正文（超 60 字截断加省略号；没有消息时为空串）

    ChatSessionList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatSessionSummary'
        total:
          type: integer
          minimum: 0

    ChatAttachment:
      type: object
      required:
        - kind
        - name
        - mime
        - bytes
        - url
      properties:
        kind:
          type: string
          enum:
            - image
        name:
          type: string
        mime:
          type: string
        bytes:
          type: integer
          minimum: 0
        url:
          type: string
          description: 取回附件的地址（可直接当 `<img src>`）

    ChatToolCall:
      type: object
      description: 一次工具调用的过程记录（挂在 assistant 消息上）。
      required:
        - tool
        - status
        - args
      properties:
        tool:
          type: string
        call_id:
          type: string
          description: 本次工具调用的标识（与 `tool_started` / `tool_progress` / `tool_finished` 事件同值，S7.20）
        attempt:
          type: integer
          minimum: 1
          description: 该工具在本次轮次内的第几次执行（重试 / 多轮递增，默认 1）
        status:
          type: string
          enum:
            - succeeded
            - failed
            - interrupted
        args:
          type: object
          additionalProperties: true
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        cost_cny:
          type: number
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        error:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        object_key:
          type: string
          description: 产物对象键（S7.25，`draft:<run_id>:<position>`）
        version_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 本次改稿提交的成功版本（拒绝 / 失败时为空）
        version_no:
          oneOf:
            - type: integer
            - type: 'null'
          description: 成功版本号（从 1 起；同对象内单调递增）
        base_version_no:
          oneOf:
            - type: integer
            - type: 'null'
          description: 实际基础版本号（首个版本的基础是运行初稿，登记为 1）

    ChatMessage:
      type: object
      required:
        - message_id
        - session_id
        - role
        - content
        - status
        - attachments
        - tool_calls
        - prompt_versions
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - interrupted
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolCall'
        prompt_versions:
          type: object
          additionalProperties:
            type: integer
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        cost_cny:
          type: number
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: string
            - type: 'null'
        turn_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 本轮对话的标识（S7.21；旧行为 null）
        trace_id:
          oneOf:
            - type: string
            - type: 'null'
          description: 本轮的 Langfuse trace id（S7.21）；追踪关闭、失败或旧行为 null
        trace_url:
          oneOf:
            - type: string
            - type: 'null'
          description: 调用链回看地址（S7.21）；有有效 trace 关联且追踪可用时才有值
        progress:
          oneOf:
            - $ref: '#/components/schemas/StageInfo'
            - type: 'null'
          description: 当前 / 最后的阶段快照（S7.21），刷新后据此恢复阶段；仅阶段切换时更新
        created_at:
          type: string
          format: date-time

    StageNode:
      type: object
      description: 阶段快照里的一次阶段执行记录（S7.20 / S7.21）。
      required:
        - stage
        - status
      properties:
        stage:
          type: string
          description: 阶段键（supervisor / image_parse / submit_analysis / queue_wait / material_sync / embedding_backfill / clue / retrieve / gaps / draft / report / final_reply）；final_reply 只出现在成功轮次，覆盖写库与终态整理区间，不代表回复生成耗时（生成区间看对应 supervisor 尝试）
        label:
          type: string
          description: 中文标签
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - skipped
            - interrupted
        attempt:
          type: integer
          minimum: 1
        started_at:
          type: string
          format: date-time
        ended_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        latency_ms:
          type: integer
          minimum: 0
        error_category:
          type: string
          description: 安全错误类别（llm_error / embedding_error / schema_error / config_error / timeout / cancelled / dependency_unavailable / internal），不含错误正文
        run_id:
          oneOf:
            - type: string
            - type: 'null'
          description: 产生该节点的分析运行 id（可选，R3）；对话轮次里同轮多次分析用它区分节点归属，缺省时按旧口径合并
        source_id:
          type: string
          description: 产生该节点的明确执行来源标识
        stage_instance_id:
          type: string
          description: 来源内阶段实例标识
        source_seq:
          type: integer
          minimum: 0
          description: 来源生产端生成的递增顺序号，不能由轮询接收端重新编号
        generation:
          type: integer
          minimum: 0
          description: worker 执行代次（投递重试号）；旧代次的迟到写入只补历史或被存储层拒绝

    StageInfo:
      type: object
      description: |
        当前阶段快照（S7.20 / S7.21）：应用内事件与可刷新状态是运行状态的事实源，
        只记阶段切换，不逐 token；`nodes` 按 `(stage, attempt, run_id?)` 去重（R3），
        单调合并——旧尝试的迟到更新不覆盖新状态，同一执行的终态不因重复 begin 重开，
        只有更高的 attempt（重试）或新阶段才能启动新的运行。
      required:
        - stage
        - status
      properties:
        stage:
          type: string
          description: 当前（或最后）阶段键；无阶段信息时为空串
        label:
          type: string
          description: 当前阶段的中文标签
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - skipped
            - interrupted
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attempt:
          type: integer
          minimum: 1
        retries:
          type: integer
          minimum: 0
        error_category:
          type: string
        last_finished_stage:
          type: string
          description: 最后完成的阶段键
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        job_id:
          oneOf:
            - type: string
            - type: 'null'
        source_id:
          type: string
          description: 当前阶段的来源标识
        stage_instance_id:
          type: string
          description: 当前阶段实例标识
        source_seq:
          type: integer
          minimum: 0
          description: 当前来源的生产顺序号
        progress_revision:
          type: integer
          minimum: 0
          description: 本轮已接受快照的语义版本；只在同一 (message_id, turn_id) 范围内可比
        generation:
          type: integer
          minimum: 0
          description: 当前阶段的 worker 执行代次（投递重试号）
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/StageNode'

    ChatSessionDetail:
      type: object
      required:
        - session_id
        - title
        - created_at
        - updated_at
        - messages
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'

    ContextFact:
      type: object
      description: 一条会话事实（S7.24）：目标、限制、偏好、受众或形式。
      required:
        - fact_id
        - kind
        - value
        - scope
        - status
        - evidence
        - created_version
      properties:
        fact_id:
          type: string
        kind:
          type: string
          enum:
            - goal
            - constraint
            - preference
            - audience
            - format
        value:
          type: string
        scope:
          type: string
          enum:
            - session
            - topic
            - artifact
        scope_id:
          type: string
          description: 作用域对象标识（`topic` = 当前话题，`artifact` = 对象键）
        status:
          type: string
          enum:
            - active
            - pending_confirmation
            - superseded
            - retracted
        evidence:
          type: string
          description: 用户原文中的真实片段（服务端做子串校验）
        source_ref:
          type: object
          additionalProperties: true
          description: 来源（`message_id` / `action_id` / `turn_id`），模型解释不作为来源
        created_version:
          type: integer
          minimum: 0
        replaces:
          oneOf:
            - type: string
            - type: 'null'
        replaces_fact_ids:
          type: array
          items:
            type: string
          description: 多项替代时记录全部被替换的旧事实 id（v2，E7CTX-04）
        updated_at:
          type: string
          format: date-time

    ContextProposal:
      type: object
      description: 待确认提案（推断、歧义或替换意图不明的冲突，S7.24）。
      required:
        - proposal_id
        - kind
        - value
        - scope
        - reason
      properties:
        proposal_id:
          type: string
        kind:
          type: string
          enum:
            - goal
            - constraint
            - preference
            - audience
            - format
        value:
          type: string
        scope:
          type: string
          enum:
            - session
            - topic
            - artifact
        scope_id:
          type: string
        reason:
          type: string
          description: 安全原因（歧义 / 推断 / 冲突），不含用户原文
        evidence:
          type: string
        source_ref:
          type: object
          additionalProperties: true
        conflicts_with:
          type: array
          items:
            type: string
        created_version:
          type: integer
          minimum: 0
        operation:
          type: string
          enum:
            - add
            - replace
            - reset_topic
            - select_object
          description: 拟执行操作（v2 §3.3A）；旧提案按 conflicts_with 推导
        replaces_fact_ids:
          type: array
          items:
            type: string
          description: 确认 replace 时要替代的旧事实（E7CTX-04）
        target_object_ref:
          type: object
          additionalProperties: true
          description: select_object 提案的目标对象（确认前由服务端验证归属）
        source_message_ids:
          type: array
          items:
            type: string

    ObjectRef:
      type: object
      description: 已验证的对象引用（v2 §3.3A）；空字段表示尚未选择，不得以空值激活产物级约束。
      required:
        - object_key
        - object_type
      properties:
        object_key:
          type: string
        object_type:
          type: string
          enum:
            - draft
            - clue
        topic_id:
          type: string
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        hotspot_position:
          oneOf:
            - type: integer
            - type: 'null'
        material_id:
          oneOf:
            - type: string
            - type: 'null'
        version_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        image_group_digest:
          oneOf:
            - type: string
            - type: 'null'
        source_ref:
          type: object
          additionalProperties: true

    RecoveryProgress:
      type: object
      description: 旧会话恢复进度（v2 §3.3A / §3.5）。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - complete
            - pending
            - running
            - awaiting_confirmation
            - interrupted
            - failed
        recovery_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        reason:
          type: string
        snapshot_last_message_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        cursor_message_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        scanned_user_messages:
          type: integer
          minimum: 0
        total_user_messages:
          type: integer
          minimum: 0
        pending_proposal_ids:
          type: array
          items:
            type: string
        accounting_message_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'

    ArtifactHead:
      type: object
      description: 一个产物对象当前指向的成功版本（S7.25）。
      required:
        - object_key
        - version_id
        - version_no
      properties:
        object_key:
          type: string
        version_id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time

    ChatContext:
      type: object
      description: 会话上下文（S7.24）。`effective_mode` 是运行时实际生效的模式。
      required:
        - session_id
        - state_version
        - recovery_status
        - facts
        - proposals
        - artifact_heads
        - effective_mode
      properties:
        session_id:
          type: string
          format: uuid
        state_version:
          type: integer
          minimum: 0
        topic_id:
          oneOf:
            - type: string
            - type: 'null'
        recovery_status:
          type: string
          enum:
            - complete
            - partial
        facts:
          type: array
          items:
            $ref: '#/components/schemas/ContextFact'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ContextProposal'
        artifact_heads:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactHead'
        effective_mode:
          type: string
          enum:
            - 'off'
            - shadow
            - enforce
        effective_mode_reason:
          type: string
          description: 实际模式的原因（configured_off / session_not_enabled / window_unverified）
        object_refs:
          type: array
          items:
            $ref: '#/components/schemas/ObjectRef'
        recovery:
          $ref: '#/components/schemas/RecoveryProgress'
        blocking_proposals:
          type: integer
          minimum: 0
          description: 阻断当前任务的待确认提案数（>0 时应先确认再继续）

    ContextActionRequest:
      type: object
      description: 上下文用户动作（v2 §3.3A）；`expected_state_version` 是 CAS 条件。
      additionalProperties: false
      required:
        - action
        - expected_state_version
      properties:
        action:
          type: string
          enum:
            - confirm
            - reject
            - retract
            - replace
            - reset_topic
            - select_object
            - recover
            - complete_recovery
        expected_state_version:
          type: integer
          minimum: 0
        action_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 幂等键；同 ID 同请求体重放返回原结果，不同请求体 409
        target_id:
          type: string
          description: 事实 / 提案标识（confirm / reject / retract / replace 必填）
        value:
          type: string
          description: 替换后的新值（replace 必填，1–200 字）
        object_ref:
          type: object
          additionalProperties: true
          description: select_object 必填；确认未解析产物提案时必填完整目标
        recovery_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 后续恢复分页及 complete_recovery 必填
        retry_of:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: 显式重试已中断 / 失败恢复时传原 action_id
        acknowledge_partial_history:
          type: boolean
          description: complete_recovery 时已知历史缺口的显式确认

    ClueVersionRequest:
      type: object
      description: 保存用户编辑的线索版本（v2 §3.3C）。
      additionalProperties: false
      required:
        - action_id
        - expected_state_version
        - object_key
        - base_version_id
        - content
      properties:
        action_id:
          type: string
          format: uuid
        expected_state_version:
          type: integer
          minimum: 0
        expected_head_version_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        object_key:
          type: string
        base_version_id:
          type: string
          format: uuid
        content:
          type: object
          additionalProperties: true
          description: '{raw_text, clue, edited_fields}；raw_text ≤ 500 字'

    ClueSelectRequest:
      type: object
      description: 选定一个线索版本（v2 §3.3C）。
      additionalProperties: false
      required:
        - action_id
        - expected_state_version
      properties:
        action_id:
          type: string
          format: uuid
        expected_state_version:
          type: integer
          minimum: 0

    ContextActionResponse:
      type: object
      description: 动作结果与最新上下文（S7.24）。
      required:
        - session_id
        - state_version
        - action
        - decision
        - context
      properties:
        session_id:
          type: string
          format: uuid
        state_version:
          type: integer
          minimum: 0
        action:
          type: string
          enum:
            - confirm
            - reject
            - retract
            - replace
            - reset_topic
            - select_object
            - recover
            - complete_recovery
        decision:
          type: string
          enum:
            - applied
            - noop
            - conflict
        reason:
          type: string
        context:
          $ref: '#/components/schemas/ChatContext'
        action_id:
          type: string
          format: uuid
        accounting_message_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        replay:
          type: boolean
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - interrupted

    ArtifactVersion:
      type: object
      description: 一个不可变的文案 / 线索版本（S7.25）。
      required:
        - version_id
        - session_id
        - object_key
        - object_type
        - status
        - prompt_versions
        - usage
        - created_at
      properties:
        version_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        object_key:
          type: string
        object_type:
          type: string
          enum:
            - draft
            - clue
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        hotspot_position:
          oneOf:
            - type: integer
            - type: 'null'
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - refused
            - interrupted
        version_no:
          oneOf:
            - type: integer
            - type: 'null'
        base_version_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        content:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        source:
          type: object
          additionalProperties: true
        prompt_versions:
          type: object
          additionalProperties:
            type: integer
        usage:
          type: object
          additionalProperties: true
        error:
          oneOf:
            - type: string
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArtifactVersionList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactVersion'
        total:
          type: integer
          minimum: 0

    MaterialTask:
      type: object
      description: 素材索引任务的状态；未知或已过期的 task_id 也返回它（state=PENDING）。
      required:
        - task_id
        - state
      properties:
        task_id:
          type: string
        state:
          type: string
          enum:
            - PENDING
            - STARTED
            - RETRY
            - SUCCESS
            - FAILURE
        step:
          oneOf:
            - type: string
            - type: 'null'
          description: 当前阶段（扫描素材目录 / 向量回填）
        summary:
          oneOf:
            - type: string
            - type: 'null'
          description: 成功时的一句话摘要，失败时的异常串（截断 500 字，不含密钥）
        result:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: 成功时的计数 dict

    UpdateMaterialRequest:
      type: object
      description: |
        `PATCH /api/materials/{material_id}` 请求体：只允许这三个字段（其余一律 422），
        且至少要给一个（否则 400）。未给的字段保持原值。
      additionalProperties: false
      properties:
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string

    MaterialList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
        - dirs
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialItem'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        dirs:
          type: array
          description: 直接子目录及其素材数（受 q / type / source 影响，不受 dir 影响）
          items:
            type: object
            required:
              - path
              - count
            properties:
              path:
                type: string
              count:
                type: integer
                minimum: 0

    Draft:
      type: object
      required:
        - titles
        - body
        - tags
      properties:
        titles:
          type: array
          description: 标题备选，小红书标题上限 20 字
          maxItems: 5
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
                maxLength: 20
              style:
                type: string
        cover_text:
          type: string
        first_3s:
          type: string
        body:
          type: string
        tags:
          type: array
          maxItems: 12
          items:
            type: string
        shot_list:
          type: array
          items:
            type: string
        compliance_notes:
          type: array
          items:
            type: string

    RunTotals:
      type: object
      required:
        - llm_calls
        - prompt_tokens
        - completion_tokens
        - cost_cny
        - latency_ms
      properties:
        llm_calls:
          type: integer
          minimum: 0
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        cost_cny:
          type: number
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0

    Health:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        checks:
          type: object
          required:
            - db
            - redis
            - llm
          properties:
            db:
              $ref: '#/components/schemas/ComponentHealth'
            redis:
              $ref: '#/components/schemas/ComponentHealth'
            llm:
              $ref: '#/components/schemas/ComponentHealth'

    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        detail:
          type: string
        latency_ms:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - bad_request
            - validation_error
            - not_found
            - conflict
            - payload_too_large
            - dependency_unavailable
            - upstream_error
            - internal_error
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
