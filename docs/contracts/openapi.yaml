          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        totals:
          $ref: '#/components/schemas/RunTotals'
        prompt_versions:
          type: object
          description: 本次运行各任务所用的 prompt 版本；键为 task_id，见 docs/contracts/prompt契约.md
          additionalProperties:
            type: integer
        hotspots:
          type: array
          description: 本次运行中每个热点的分析结果
          items:
            $ref: '#/components/schemas/HotspotResult'

    HotspotResult:
      type: object
      required:
        - hotspot_id
        - hotspot_raw
        - clue
        - coverage
        - candidates
      properties:
        hotspot_id:
          type: string
          format: uuid
        hotspot_raw:
          type: string
        clue:
          $ref: '#/components/schemas/HotspotClue'
        coverage:
          $ref: '#/components/schemas/Coverage'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        draft:
          oneOf:
            - $ref: '#/components/schemas/Draft'
            - type: 'null'

    HotspotClue:
      type: object
      required:
        - why_it_works
        - mechanisms
        - elements
      properties:
        why_it_works:
          type: array
          items:
            type: string
        mechanisms:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              explain:
                type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        match_keywords:
          type: array
          items:
            type: string
        audience:
          type: object
          additionalProperties: true
        borrow_angles:
          type: array
          items:
            type: string
        risk_notes:
          type: array
          items:
            type: string

    Element:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: 爆点要素类型，口径见 docs/产品方案.md 第六节
          enum:
            - ip
            - topic
            - scene
            - visual
            - emotion
            - sound
            - conflict
            - format
            - audience
        value:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.6
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        evidence:
          type: string

    Coverage:
      type: object
      required:
        - ratio
        - covered
        - gaps
      properties:
        ratio:
          type: number
          minimum: 0
          maximum: 1
          description: 被素材命中的线索要素权重占比
        covered:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Element'

    MatchCandidate:
      type: object
      required:
        - rank
        - material_id
        - score
        - recall_sources
        - hits
        - missing
        - reasons
        - usage
        - material
      properties:
        rank:
          type: integer
          minimum: 1
        material_id:
          type: string
          format: uuid
        score:
          type: number
          minimum: 0
          maximum: 1
        recall_sources:
          type: array
          description: 该素材由哪些召回通道带回（literal / vector），用于解释排序来源
          items:
            type: string
            enum:
              - literal
              - vector
        hits:
          type: array
          items:
            $ref: '#/components/schemas/MatchHit'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        reasons:
          type: array
          description: 为什么相关；不允许为空，系统不允许出现无理由候选
          minItems: 1
          items:
            type: string
        usage:
          type: string
          description: 建议怎么用（放开头 3 秒 / 当过程画面等）
        material:
          $ref: '#/components/schemas/MaterialSummary'

    MatchHit:
      type: object
      required:
        - element_type
        - clue_value
      properties:
        element_type:
          type: string
          enum:
            - ip
            - topic
            - scene
            - visual
            - emotion
            - sound
            - conflict
            - format
            - audience
        clue_value:
          type: string
        hit_value:
          type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1
        contribution:
          type: number
          minimum: 0
          maximum: 1

    MaterialSummary:
      type: object
      required:
        - id
        - path
        - type
      properties:
        id:
          type: string
          format: uuid
        path:
