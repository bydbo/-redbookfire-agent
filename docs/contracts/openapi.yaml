openapi: 3.1.0

info:
  title: 小红书热点搭子 · 热点相关性 API
  version: 0.1.0
  summary: 输入热点，在本地素材库中检索可蹭素材并产出文案初稿
  description: |
    ## 本文件的地位

    本文件是 API 的**唯一事实源**。代码向契约对齐；改接口必须先改本文件，
    再改实现，并通过 CI 中的契约一致性校验（见 docs/backlog.md 的 S4.6）。

    ## 设计前提

    - **本地单人工具**：不提供鉴权、不区分用户、不做限流。此处写"不适用"而非留空，
      是为了让面试追问时能给出明确答案，而不是"还没来得及做"。
    - **不做运行时降级**：依赖不可用时返回错误码，不返回降级结果。
    - **分析是异步任务**：`POST /api/analyze` 立即返回 `job_id`，进度与结果分开查询。
    - **API 统一 `/api` 前缀**（见 ADR 0009）：根路径与其余非 `/api` 路径全部交给前端单页应用，
      前端路由与 API 路径互不干扰。
    - **前端不在本契约内**：单页应用的构建产物由服务端静态挂载，技术栈见 `docs/技术栈.md`。

    ## 通用约定

    - 字段名一律 snake_case；时间戳为 RFC 3339（UTC）。
    - 除报告接口外，响应体均为 `application/json`。
    - 请求可携带 `X-Request-ID`，响应同值回写；未携带时由服务端生成，并贯穿日志与调用追踪。
    - `topk` 默认 5，允许范围 1–20；`hotspots` 允许 1–10 条。

    ## 错误码

    | code | HTTP | 含义 |
    | --- | --- | --- |
    | `bad_request` | 400 | 请求格式或参数不合法 |
    | `validation_error` | 422 | 字段级校验失败（如 topk 越界） |
    | `not_found` | 404 | job_id 或 run_id 不存在 |
    | `conflict` | 409 | 当前状态不允许该操作（如运行尚未完成就取结果） |
    | `payload_too_large` | 413 | 请求体超过体积上限（如上传超过 `[upload].max_size_gb`） |
    | `dependency_unavailable` | 503 | 数据库或 Redis 不可用，或模型配置缺失 |
    | `upstream_error` | 502 | 上游模型返回错误或连续重试失败 |
    | `internal_error` | 500 | 未分类的内部错误 |
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地与演示环境。API 统一挂载在 /api 前缀下；根路径与前端路由由单页应用处理（见 ADR 0009）。
security: []
tags:
  - name: 分析
    description: 提交热点并跟踪任务
  - name: 结果
    description: 读取运行结果与报告
  - name: 素材
    description: 浏览、整理与导入本地素材库
  - name: 对话
    description: 对话式入口：会话、消息与流式回复
  - name: 运维
    description: 健康检查

paths:
  /api/health:
    get:
      tags:
        - 运维
      summary: 健康检查
      description: 逐项返回探测结果——数据库与 Redis 是**真实连接探测**；llm 项只校验**配置就绪性**（不发真实请求：会烧钱，也容易被网络抖动误判，与 probe.py 的口径一致）。任一不可用时整体状态为 down 并返回 503。
      operationId: getHealth
      responses:
        '200':
          description: 全部依赖可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 存在不可用依赖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/analyze:
    post:
      tags:
        - 分析
      summary: 提交热点分析任务
      description: |
        接受一个或多个热点文本，落库生成 hotspot 与 run 记录，投递异步任务后立即返回。
        同一请求内多个热点按顺序分别分析，互不影响。
      operationId: createAnalysis
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '202':
          description: 任务已接受
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/hotspots/image-clue:
    post:
      tags:
        - 分析
      summary: 从图片拆解热点线索
      description: |
        上传一张热点图片（jpg / png / webp，单张，≤ 10 MB），由多模态模型拆成「热点描述 + 爆点要素」。
        图片**只在内存里转成模型输入**——不落盘、不入库；与素材上传是两条独立链路。
        解析结果同样不落库：用户确认（可编辑）后随 `POST /api/analyze` 的 `clues` 字段一起提交。
        该接口**不要求 ffmpeg**（图片不抽帧）：只要求 `[vision].enabled = true` 与密钥。
      operationId: createImageClue
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 单张图片（jpg / png / webp，≤ 10 MB）
      responses:
        '200':
          description: 解析结果（未落库，供用户确认后随 clues 提交）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageClueResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/jobs/{job_id}:
    get:
      tags:
        - 分析
      summary: 查询任务状态
      description: 轮询任务进度；succeeded 后可凭 run_id 取结果，failed 时 error 字段给出失败原因。
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs:
    get:
      tags:
        - 结果
      summary: 列出历史运行
      description: 按创建时间倒序分页返回历史运行摘要（run_id、状态、热点数与首条热点预览、成本与耗时）。
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 历史运行列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs/{run_id}:
    get:
      tags:
        - 结果
      summary: 读取运行结果
      description: 返回该次运行的结构化结果：线索、候选素材、覆盖缺口与文稿。
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 运行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs/{run_id}/report:
    get:
      tags:
        - 结果
      summary: 读取报告
      description: 返回渲染好的报告；html 为自带样式的单文件，md 为可直接复制的文本。
      operationId: getRunReport
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - html
              - md
            default: html
      responses:
        '200':
          description: 报告内容
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/materials/{material_id}/keyframes/{index}:
    get:
      tags:
        - 结果
      summary: 读取素材关键帧图片
      description: |
        返回候选素材登记的关键帧图片（JPEG），供结果详情页缩略图使用。
        帧路径来自素材库的关键帧缓存目录；素材不存在、下标越界或文件缺失一律 404，
        不区分原因（避免暴露素材库内部布局）。
      operationId: getMaterialKeyframe
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 关键帧图片（JPEG）
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials:
    get:
      tags:
        - 素材
      summary: 列出素材库
      description: |
        按索引时间倒序分页返回素材库；支持关键词（标题或标签的子串）、类型、打标来源与
        主题目录筛选。`dirs` 是**直接子目录**的计数（受 `q` / `type` / `source` 影响、
        不受 `dir` 影响），供前端渲染主题导航。磁盘目录是唯一来源，这里是索引副本。
      operationId: listMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          required: false
          description: 关键词；匹配标题或任一标签（大小写不敏感的子串，去空白后为空即忽略）
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: 素材类型
          schema:
            type: string
            enum:
              - video
              - image
        - name: source
          in: query
          required: false
          description: 打标来源
          schema:
            type: string
            enum:
              - sidecar
              - vision
              - filename
              - legacy
        - name: dir
          in: query
          required: false
          description: |
            主题目录（相对素材根目录的路径，正斜杠）；空串表示只看直接放在根目录下的素材，
            非空时按前缀匹配（含子目录）。不传 = 全部。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 素材列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/scan:
    post:
      tags:
        - 素材
      summary: 触发素材库扫描
      description: |
        投递一次「增量同步 + 向量回填」：扫描 `<素材根>` 下新增 / 变更 / 消失的文件并落库，
        再给缺向量的素材补齐 `embedding`。素材目录不存在时任务以 FAILURE 结束（不做降级）。
        进度与失败原因用 `GET /api/materials/tasks/{task_id}` 查。
      operationId: scanMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: 已受理索引任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTaskAccepted'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/uploads:
    post:
      tags:
        - 素材
      summary: 上传素材
      description: |
        流式接收**单个**媒体文件，落到 `<素材根>/<YYYY-MM>/`（同名自动加 `-2` 序号，不覆盖），
        随后投递索引任务（抽帧 + 打标 + 向量回填）。
        扩展名必须在 `[upload].allowed_extensions` 里（否则 400）；体积上限 `[upload].max_size_gb`
        （超限 413，边写边计并清理临时文件）；空文件 400。
        文件先写 `.incoming-*.part` 再原子改名，失败不会在素材目录里留下半截文件。
      operationId: uploadMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: 文件已落盘并受理索引任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialUploadAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/tasks/{task_id}:
    get:
      tags:
        - 素材
      summary: 查询素材索引任务
      description: |
        读任务状态：`state` 是 Celery 的标准五态，`step` 是当前阶段（扫描素材目录 / 向量回填），
        `summary` 是成功时的一句话摘要或失败时的异常串（截断 500 字，不含密钥），
        `result` 是成功时的计数 dict。**未知或已过期的 `task_id` 返回 200 + `PENDING`**
        （结果键的 TTL 是 1 小时：进度是临时的，素材本身以磁盘与数据库为准）。
      operationId: getMaterialTask
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTask'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/trash:
    get:
      tags:
        - 素材
      summary: 列出回收站
      description: |
        递归扫 `<素材根>/_trash/`，返回里面的媒体文件（旁车跟着媒体走，不单独列出）。
        `_trash` 是回收站目录：扫描素材库时跳过它，所以「移进来」就等于出库。
      operationId: listTrashedMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 回收站内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/trash/restore:
    post:
      tags:
        - 素材
      summary: 从回收站恢复
      description: |
        把回收站里的一条（连同它的旁车）移回素材目录的**原相对路径**，并触发一次索引任务。
        **恢复等于重新入库**：新 uuid、重新打标；移入回收站时 `run_matches` 已被外键级联清理，
        历史候选不会回来。目标位置已有同名文件 → 409。
      operationId: restoreMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashRestoreRequest'
      responses:
        '202':
          description: 已恢复并受理索引任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 目标位置已有同名文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/trash/purge:
    post:
      tags:
        - 素材
      summary: 真删回收站里的文件
      description: |
        真删（不可恢复）：`paths` 给具体条目（连同旁车一起删），`all=true` 清空整个回收站；
        两者二选一必填，且 `confirm` 必须为 `true`（二次确认）。先整体校验再删，
        任何一条不在回收站里就 404，不做部分删除。
      operationId: purgeTrashedMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashPurgeRequest'
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashPurgeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/{material_id}:
    get:
      tags:
        - 素材
      summary: 读取素材详情
      description: 返回单个素材的完整索引信息（含爆点要素 `elements`）；非法或未知 id 一律 404。
      operationId: getMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    patch:
      tags:
        - 素材
      summary: 修改素材元数据
      description: |
        只接受 `title` / `tags` / `description`（白名单，其余字段一律 422 拒绝而不是静默忽略），
        且至少要给一个字段（否则 400）。写入落两处：先写同名旁车 `<素材文件名>.txt`
        （`标题: …` / `标签: a, b` / `描述: …`），再更新 `materials` 行——磁盘目录始终是
        唯一来源，重扫描会得到同一份事实。三个字段的值都没变时不写文件。
        标签会去空白、去 `#` 前缀并去重；去重后最多 14 个、单个标签最多 24 字（超出 400）。
        标题与描述按**单行**处理（换行折成空格），因为旁车是 `键: 值` 行格式。
      operationId: updateMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialRequest'
      responses:
        '200':
          description: 更新后的素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/{material_id}/trash:
    post:
      tags:
        - 素材
      summary: 把素材移进回收站
      description: |
        把素材（连同它的 `.txt` / `.md` / `.json` 旁车）移到 `<素材根>/_trash/<原相对路径>`，
        并删掉索引行；回收站里已有同名时自动加 `-2` 序号，不覆盖。
        删行会让 `run_matches` 通过外键级联清理——**历史候选不再回来**（恢复 = 重新入库，
        新 uuid）。磁盘上文件已不在时仍然删行，响应里 `file_missing=true`。
      operationId: trashMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 移入回收站的结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTrashResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions:
    post:
      tags:
        - 对话
      summary: 新建对话会话
      description: |
        建一个空会话（前端「新对话」）。标题留空，等**首条用户消息**落库时取前 20 字自动补上；
        会话与消息只在本机数据库里，附件落在 `runs/_chat/<session_id>/`。
      operationId: createChatSession
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    get:
      tags:
        - 对话
      summary: 列出对话会话
      description: 按最近活跃（`updated_at`）倒序分页；每项带消息数与末条消息预览（超 60 字截断）。
      operationId: listChatSessions
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}:
    get:
      tags:
        - 对话
      summary: 读取会话与消息
      description: |
        返回会话与它的消息（按时间升序）。`status=running` 的 assistant 消息代表"这一轮还没跑完"，
        前端刷新后用轮询补齐；超过 `[chat].turn_stale_seconds` 仍未收尾的会被标成 `interrupted`。
      operationId: getChatSession
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: 只取最近 N 条消息（不传 = 全部）
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/messages:
    post:
      tags:
        - 对话
      summary: 发一条消息（SSE 流式）
      description: |
        一次 multipart 请求带上文字与（可选的）一张图片，返回 `text/event-stream`：
        `turn_started` → （可选）`tool_started` / `tool_progress` / `tool_finished` →
        `text_delta`（真 token 增量）→ `turn_finished`（带 run_id）；失败则发一条 `error`
        并结束这一轮。每一行 `data:` 是一个 JSON 对象。
        **断开浏览器只停转发**：这一轮照常跑完并落库（库里能看到 assistant 消息的终态）。
        图片只接受 jpg / png / webp（按 magic bytes），单张上限 `[chat].attachment_max_mb`。
      operationId: postChatMessage
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: 用户这条消息的文字（与图片至少给一个）
                file:
                  type: string
                  format: binary
                  description: 可选的热点图片（jpg / png / webp）
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/chat/sessions/{session_id}/attachments/{message_id}/{index}:
    get:
      tags:
        - 对话
      summary: 读取会话里的附件
      description: |
        按会话 + 消息 + 下标取回附件原图（回看历史会话时用）。消息不属于该会话、下标越界、
        文件缺失一律 404，不区分原因（与关键帧接口同一口径，避免暴露内部布局）。
      operationId: getChatAttachment
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 附件图片
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 客户端生成的请求标识；未提供时由服务端生成。用于贯穿日志、调用追踪与数据库记录。
      schema:
        type: string
        maxLength: 128

  headers:
    RequestId:
      description: 本次请求的标识
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求格式或参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 字段级校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: 依赖不可用（不做降级，直接返回错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 请求体超过体积上限（上传超过 `[upload].max_size_gb`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: 上游服务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - hotspots
      properties:
        hotspots:
          type: array
          minItems: 1
          maxItems: 10
          description: 热点文本列表（话题句或链接文本均可）
          items:
            type: string
            minLength: 1
            maxLength: 500
        topk:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: 每个热点返回的候选素材数量上限
        clues:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            预设线索快照（S6.7）：与 hotspots **一一对应、等长**；某一项为 null 表示该热点走正常拆解。
            非空的那一项会写进对应 hotspots 行的 clue 并**短路拆解节点**（用户确认/编辑过的标签原样生效，
            不重复付费）。不传时行为与不带该字段完全一致。
          items:
            oneOf:
              - $ref: '#/components/schemas/HotspotClue'
              - type: 'null'

    AnalyzeAccepted:
      type: object
      required:
        - job_id
        - run_id
      properties:
        job_id:
          type: string
          description: 异步任务标识，用于轮询状态
        run_id:
          type: string
          format: uuid
          description: 运行记录标识，用于读取结果与报告

    ImageClueResult:
      type: object
      required:
        - raw_text
        - clue
        - prompt_versions
      properties:
        raw_text:
          type: string
          description: 模型给出的热点描述（≤ 500 字）；用户可编辑后作为 hotspots 提交
        clue:
          $ref: '#/components/schemas/HotspotClue'
        prompt_versions:
          type: object
          description: '本次解析实际使用的 prompt 版本，如 {"image_hotspot_clue": 1}'
          additionalProperties:
            type: integer

    JobStatus:
      type: object
      required:
        - job_id
        - run_id
        - status
        - progress
      properties:
        job_id:
          type: string
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: 0–1 的完成比例
        current_step:
          type: string
          description: 当前所处步骤（拆解 / 检索 / 缺口 / 撰稿 / 报告）
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'

    RunSummary:
      type: object
      required:
        - run_id
        - status
        - created_at
        - hotspot_count
        - hotspot_preview
        - topk
        - totals
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        hotspot_count:
          type: integer
          minimum: 0
        hotspot_preview:
          type: string
          description: 第一条热点的原文预览（超过 60 字截断加省略号）
        topk:
          type: integer
          minimum: 1
          maximum: 20
        totals:
          $ref: '#/components/schemas/RunTotals'
        error:
          oneOf:
            - type: string
            - type: 'null'

    RunList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total:
          type: integer
          minimum: 0

    RunDetail:
      type: object
      required:
        - run_id
        - status
        - created_at
        - totals
        - prompt_versions
        - hotspots
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        totals:
          $ref: '#/components/schemas/RunTotals'
        prompt_versions:
          type: object
          description: 本次运行各任务所用的 prompt 版本；键为 task_id，见 docs/contracts/prompt契约.md
          additionalProperties:
            type: integer
        hotspots:
          type: array
          description: 本次运行中每个热点的分析结果
          items:
            $ref: '#/components/schemas/HotspotResult'

    HotspotResult:
      type: object
      required:
        - hotspot_id
        - hotspot_raw
        - clue
        - coverage
        - candidates
      properties:
        hotspot_id:
          type: string
          format: uuid
        hotspot_raw:
          type: string
        clue:
          $ref: '#/components/schemas/HotspotClue'
        coverage:
          $ref: '#/components/schemas/Coverage'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        draft:
          oneOf:
            - $ref: '#/components/schemas/Draft'
            - type: 'null'

    HotspotClue:
      type: object
      required:
        - why_it_works
        - mechanisms
        - elements
      properties:
        why_it_works:
          type: array
          items:
            type: string
        mechanisms:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              explain:
                type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        match_keywords:
          type: array
          items:
            type: string
        audience:
          type: object
          additionalProperties: true
        borrow_angles:
          type: array
          items:
            type: string
        risk_notes:
          type: array
          items:
            type: string

    Element:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: 爆点要素类型，口径见 docs/产品方案.md 第六节
          enum:
            - ip
            - topic
            - scene
            - visual
            - emotion
            - sound
            - conflict
            - format
            - audience
        value:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.6
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        evidence:
          type: string

    Coverage:
      type: object
      required:
        - ratio
        - covered
        - gaps
      properties:
        ratio:
          type: number
          minimum: 0
          maximum: 1
          description: 被素材命中的线索要素权重占比
        covered:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Element'

    MatchCandidate:
      type: object
      required:
        - rank
        - material_id
        - score
        - recall_sources
        - hits
        - missing
        - reasons
        - usage
        - material
      properties:
        rank:
          type: integer
          minimum: 1
        material_id:
          type: string
          format: uuid
        score:
          type: number
          minimum: 0
          maximum: 1
        recall_sources:
          type: array
          description: 该素材由哪些召回通道带回（literal / vector），用于解释排序来源
          items:
            type: string
            enum:
              - literal
              - vector
        hits:
          type: array
          items:
            $ref: '#/components/schemas/MatchHit'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        reasons:
          type: array
          description: 为什么相关；不允许为空，系统不允许出现无理由候选
          minItems: 1
          items:
            type: string
        usage:
          type: string
          description: 建议怎么用（放开头 3 秒 / 当过程画面等）
        material:
          $ref: '#/components/schemas/MaterialSummary'

    MatchHit:
      type: object
      required:
        - element_type
        - clue_value
      properties:
        element_type:
          type: string
          enum:
            - ip
            - topic
            - scene
            - visual
            - emotion
            - sound
            - conflict
            - format
            - audience
        clue_value:
          type: string
        hit_value:
          type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1
        contribution:
          type: number
          minimum: 0
          maximum: 1

    MaterialSummary:
      type: object
      required:
        - id
        - path
        - type
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        keyframes:
          type: array
          items:
            type: string

    MaterialItem:
      type: object
      description: 素材库列表里的一条素材（磁盘目录是唯一来源，这里是索引副本）。
      required:
        - id
        - path
        - type
        - title
        - description
        - tags
        - duration_s
        - width
        - height
        - has_audio
        - size_bytes
        - source
        - keyframes
        - indexed_at
        - dir
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: 素材绝对路径
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        size_bytes:
          type: integer
        source:
          type: string
          enum:
            - sidecar
            - vision
            - filename
            - legacy
        keyframes:
          type: array
          items:
            type: string
        indexed_at:
          type: string
          format: date-time
        dir:
          type: string
          description: 相对素材根目录的父目录（正斜杠；直接放在根目录下时为空串），供前端显示主题

    MaterialDetail:
      type: object
      description: 素材详情：列表项的全部字段 + 爆点要素。
      required:
        - id
        - path
        - type
        - title
        - description
        - tags
        - duration_s
        - width
        - height
        - has_audio
        - size_bytes
        - source
        - keyframes
        - indexed_at
        - dir
        - elements
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: 素材绝对路径
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        size_bytes:
          type: integer
        source:
          type: string
          enum:
            - sidecar
            - vision
            - filename
            - legacy
        keyframes:
          type: array
          items:
            type: string
        indexed_at:
          type: string
          format: date-time
        dir:
          type: string
          description: 相对素材根目录的父目录（正斜杠；直接放在根目录下时为空串），供前端显示主题
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'

    MaterialTrashResult:
      type: object
      description: 把一个素材移进回收站的结果。
      required:
        - material_id
        - path
        - trashed_path
        - file_missing
      properties:
        material_id:
          type: string
          format: uuid
        path:
          type: string
          description: 移入前的相对路径（原样，不带序号）
        trashed_path:
          type: string
          description: 回收站里的相对路径（同名时带 `-2` 序号）
        file_missing:
          type: boolean
          description: 磁盘上本来就没有这个文件（只删了索引行）

    TrashItem:
      type: object
      description: 回收站里的一条素材（旁车跟着媒体走，不单独列出）。
      required:
        - path
        - name
        - type
        - size_bytes
        - mtime
      properties:
        path:
          type: string
          description: 相对 `_trash/` 的路径（正斜杠）
        name:
          type: string
        type:
          type: string
          enum:
            - video
            - image
        size_bytes:
          type: integer
          minimum: 0
        mtime:
          type: string
          format: date-time

    TrashList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashItem'
        total:
          type: integer
          minimum: 0

    TrashRestoreRequest:
      type: object
      description: 恢复请求：`path` 是回收站里的相对路径（正斜杠，越界一律 400）。
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string

    TrashPurgeRequest:
      type: object
      description: |
        真删请求：`paths` 与 `all=true` 二选一必填，且 `confirm` 必须为 `true`（二次确认）。
        违反其中任一条都是 400。
      additionalProperties: false
      properties:
        paths:
          type: array
          items:
            type: string
        all:
          type: boolean
        confirm:
          type: boolean

    TrashPurgeResult:
      type: object
      required:
        - deleted
        - count
      properties:
        deleted:
          type: array
          description: 真删掉的相对路径（含跟随媒体一起删的旁车）
          items:
            type: string
        count:
          type: integer
          minimum: 0

    MaterialTaskAccepted:
      type: object
      description: 素材索引任务已受理；`task_id` 用于 `GET /api/materials/tasks/{task_id}`。
      required:
        - task_id
      properties:
        task_id:
          type: string

    MaterialUploadAccepted:
      type: object
      description: 上传受理结果：文件已落盘，索引任务已投递。
      required:
        - task_id
        - path
        - name
      properties:
        task_id:
          type: string
        path:
          type: string
          description: 相对素材根目录的正斜杠路径（`<YYYY-MM>/名称.mp4`）
        name:
          type: string
          description: 实际落盘的文件名（同名时带 `-2` 序号）

    ChatSessionCreate:
      type: object
      description: 建会话请求体；可以不传（标题留空，等首条用户消息自动补）。
      additionalProperties: false
      properties:
        title:
          type: string

    ChatSession:
      type: object
      required:
        - session_id
        - title
        - created_at
        - updated_at
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
          description: 取首条用户消息前 20 字；未发言时为「新对话」，不可编辑
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatSessionSummary:
      type: object
      required:
        - session_id
        - title
        - created_at
        - updated_at
        - message_count
        - last_message_preview
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer
          minimum: 0
        last_message_preview:
          type: string
          description: 末条消息正文（超 60 字截断加省略号；没有消息时为空串）

    ChatSessionList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatSessionSummary'
        total:
          type: integer
          minimum: 0

    ChatAttachment:
      type: object
      required:
        - kind
        - name
        - mime
        - bytes
        - url
      properties:
        kind:
          type: string
          enum:
            - image
        name:
          type: string
        mime:
          type: string
        bytes:
          type: integer
          minimum: 0
        url:
          type: string
          description: 取回附件的地址（可直接当 `<img src>`）

    ChatToolCall:
      type: object
      description: 一次工具调用的过程记录（挂在 assistant 消息上）。
      required:
        - tool
        - status
        - args
      properties:
        tool:
          type: string
        status:
          type: string
          enum:
            - succeeded
            - failed
        args:
          type: object
          additionalProperties: true
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        cost_cny:
          type: number
        latency_ms:
          type: integer
          minimum: 0
        error:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: true

    ChatMessage:
      type: object
      required:
        - message_id
        - session_id
        - role
        - content
        - status
        - attachments
        - tool_calls
        - prompt_versions
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - interrupted
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolCall'
        prompt_versions:
          type: object
          additionalProperties:
            type: integer
        run_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        cost_cny:
          type: number
        latency_ms:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: string
            - type: 'null'
        created_at:
          type: string
          format: date-time

    ChatSessionDetail:
      type: object
      required:
        - session_id
        - title
        - created_at
        - updated_at
        - messages
      properties:
        session_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'

    MaterialTask:
      type: object
      description: 素材索引任务的状态；未知或已过期的 task_id 也返回它（state=PENDING）。
      required:
        - task_id
        - state
      properties:
        task_id:
          type: string
        state:
          type: string
          enum:
            - PENDING
            - STARTED
            - RETRY
            - SUCCESS
            - FAILURE
        step:
          oneOf:
            - type: string
            - type: 'null'
          description: 当前阶段（扫描素材目录 / 向量回填）
        summary:
          oneOf:
            - type: string
            - type: 'null'
          description: 成功时的一句话摘要，失败时的异常串（截断 500 字，不含密钥）
        result:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
          description: 成功时的计数 dict

    UpdateMaterialRequest:
      type: object
      description: |
        `PATCH /api/materials/{material_id}` 请求体：只允许这三个字段（其余一律 422），
        且至少要给一个（否则 400）。未给的字段保持原值。
      additionalProperties: false
      properties:
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string

    MaterialList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
        - dirs
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialItem'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        dirs:
          type: array
          description: 直接子目录及其素材数（受 q / type / source 影响，不受 dir 影响）
          items:
            type: object
            required:
              - path
              - count
            properties:
              path:
                type: string
              count:
                type: integer
                minimum: 0

    Draft:
      type: object
      required:
        - titles
        - body
        - tags
      properties:
        titles:
          type: array
          description: 标题备选，小红书标题上限 20 字
          maxItems: 5
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
                maxLength: 20
              style:
                type: string
        cover_text:
          type: string
        first_3s:
          type: string
        body:
          type: string
        tags:
          type: array
          maxItems: 12
          items:
            type: string
        shot_list:
          type: array
          items:
            type: string
        compliance_notes:
          type: array
          items:
            type: string

    RunTotals:
      type: object
      required:
        - llm_calls
        - prompt_tokens
        - completion_tokens
        - cost_cny
        - latency_ms
      properties:
        llm_calls:
          type: integer
          minimum: 0
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        cost_cny:
          type: number
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0

    Health:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        checks:
          type: object
          required:
            - db
            - redis
            - llm
          properties:
            db:
              $ref: '#/components/schemas/ComponentHealth'
            redis:
              $ref: '#/components/schemas/ComponentHealth'
            llm:
              $ref: '#/components/schemas/ComponentHealth'

    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        detail:
          type: string
        latency_ms:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - bad_request
            - validation_error
            - not_found
            - conflict
            - payload_too_large
            - dependency_unavailable
            - upstream_error
            - internal_error
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
