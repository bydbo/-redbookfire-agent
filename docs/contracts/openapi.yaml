openapi: 3.1.0

info:
  title: 小红书热点搭子 · 热点相关性 API
  version: 0.1.0
  summary: 输入热点，在本地素材库中检索可蹭素材并产出文案初稿
  description: |
    ## 本文件的地位

    本文件是 API 的**唯一事实源**。代码向契约对齐；改接口必须先改本文件，
    再改实现，并通过 CI 中的契约一致性校验（见 docs/backlog.md 的 S4.6）。

    ## 设计前提

    - **本地单人工具**：不提供鉴权、不区分用户、不做限流。此处写"不适用"而非留空，
      是为了让面试追问时能给出明确答案，而不是"还没来得及做"。
    - **不做运行时降级**：依赖不可用时返回错误码，不返回降级结果。
    - **分析是异步任务**：`POST /api/analyze` 立即返回 `job_id`，进度与结果分开查询。
    - **API 统一 `/api` 前缀**（见 ADR 0009）：根路径与其余非 `/api` 路径全部交给前端单页应用，
      前端路由与 API 路径互不干扰。
    - **前端不在本契约内**：单页应用的构建产物由服务端静态挂载，技术栈见 `docs/技术栈.md`。

    ## 通用约定

    - 字段名一律 snake_case；时间戳为 RFC 3339（UTC）。
    - 除报告接口外，响应体均为 `application/json`。
    - 请求可携带 `X-Request-ID`，响应同值回写；未携带时由服务端生成，并贯穿日志与调用追踪。
    - `topk` 默认 5，允许范围 1–20；`hotspots` 允许 1–10 条。

    ## 错误码

    | code | HTTP | 含义 |
    | --- | --- | --- |
    | `bad_request` | 400 | 请求格式或参数不合法 |
    | `validation_error` | 422 | 字段级校验失败（如 topk 越界） |
    | `not_found` | 404 | job_id 或 run_id 不存在 |
    | `conflict` | 409 | 当前状态不允许该操作（如运行尚未完成就取结果） |
    | `dependency_unavailable` | 503 | 数据库或 Redis 不可用，或模型配置缺失 |
    | `upstream_error` | 502 | 上游模型返回错误或连续重试失败 |
    | `internal_error` | 500 | 未分类的内部错误 |
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: 本地与演示环境。API 统一挂载在 /api 前缀下；根路径与前端路由由单页应用处理（见 ADR 0009）。
security: []
tags:
  - name: 分析
    description: 提交热点并跟踪任务
  - name: 结果
    description: 读取运行结果与报告
  - name: 素材
    description: 浏览、整理与导入本地素材库
  - name: 运维
    description: 健康检查

paths:
  /api/health:
    get:
      tags:
        - 运维
      summary: 健康检查
      description: 逐项返回探测结果——数据库与 Redis 是**真实连接探测**；llm 项只校验**配置就绪性**（不发真实请求：会烧钱，也容易被网络抖动误判，与 probe.py 的口径一致）。任一不可用时整体状态为 down 并返回 503。
      operationId: getHealth
      responses:
        '200':
          description: 全部依赖可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 存在不可用依赖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/analyze:
    post:
      tags:
        - 分析
      summary: 提交热点分析任务
      description: |
        接受一个或多个热点文本，落库生成 hotspot 与 run 记录，投递异步任务后立即返回。
        同一请求内多个热点按顺序分别分析，互不影响。
      operationId: createAnalysis
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '202':
          description: 任务已接受
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/hotspots/image-clue:
    post:
      tags:
        - 分析
      summary: 从图片拆解热点线索
      description: |
        上传一张热点图片（jpg / png / webp，单张，≤ 10 MB），由多模态模型拆成「热点描述 + 爆点要素」。
        图片**只在内存里转成模型输入**——不落盘、不入库；与素材上传是两条独立链路。
        解析结果同样不落库：用户确认（可编辑）后随 `POST /api/analyze` 的 `clues` 字段一起提交。
        该接口**不要求 ffmpeg**（图片不抽帧）：只要求 `[vision].enabled = true` 与密钥。
      operationId: createImageClue
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 单张图片（jpg / png / webp，≤ 10 MB）
      responses:
        '200':
          description: 解析结果（未落库，供用户确认后随 clues 提交）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageClueResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/jobs/{job_id}:
    get:
      tags:
        - 分析
      summary: 查询任务状态
      description: 轮询任务进度；succeeded 后可凭 run_id 取结果，failed 时 error 字段给出失败原因。
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs:
    get:
      tags:
        - 结果
      summary: 列出历史运行
      description: 按创建时间倒序分页返回历史运行摘要（run_id、状态、热点数与首条热点预览、成本与耗时）。
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 历史运行列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs/{run_id}:
    get:
      tags:
        - 结果
      summary: 读取运行结果
      description: 返回该次运行的结构化结果：线索、候选素材、覆盖缺口与文稿。
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 运行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/runs/{run_id}/report:
    get:
      tags:
        - 结果
      summary: 读取报告
      description: 返回渲染好的报告；html 为自带样式的单文件，md 为可直接复制的文本。
      operationId: getRunReport
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - html
              - md
            default: html
      responses:
        '200':
          description: 报告内容
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 运行尚未完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/materials/{material_id}/keyframes/{index}:
    get:
      tags:
        - 结果
      summary: 读取素材关键帧图片
      description: |
        返回候选素材登记的关键帧图片（JPEG），供结果详情页缩略图使用。
        帧路径来自素材库的关键帧缓存目录；素材不存在、下标越界或文件缺失一律 404，
        不区分原因（避免暴露素材库内部布局）。
      operationId: getMaterialKeyframe
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 关键帧图片（JPEG）
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials:
    get:
      tags:
        - 素材
      summary: 列出素材库
      description: |
        按索引时间倒序分页返回素材库；支持关键词（标题或标签的子串）、类型、打标来源与
        主题目录筛选。`dirs` 是**直接子目录**的计数（受 `q` / `type` / `source` 影响、
        不受 `dir` 影响），供前端渲染主题导航。磁盘目录是唯一来源，这里是索引副本。
      operationId: listMaterials
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          required: false
          description: 关键词；匹配标题或任一标签（大小写不敏感的子串，去空白后为空即忽略）
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: 素材类型
          schema:
            type: string
            enum:
              - video
              - image
        - name: source
          in: query
          required: false
          description: 打标来源
          schema:
            type: string
            enum:
              - sidecar
              - vision
              - filename
              - legacy
        - name: dir
          in: query
          required: false
          description: |
            主题目录（相对素材根目录的路径，正斜杠）；空串表示只看直接放在根目录下的素材，
            非空时按前缀匹配（含子目录）。不传 = 全部。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 素材列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialList'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/materials/{material_id}:
    get:
      tags:
        - 素材
      summary: 读取素材详情
      description: 返回单个素材的完整索引信息（含爆点要素 `elements`）；非法或未知 id 一律 404。
      operationId: getMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    patch:
      tags:
        - 素材
      summary: 修改素材元数据
      description: |
        只接受 `title` / `tags` / `description`（白名单，其余字段一律 422 拒绝而不是静默忽略），
        且至少要给一个字段（否则 400）。写入落两处：先写同名旁车 `<素材文件名>.txt`
        （`标题: …` / `标签: a, b` / `描述: …`），再更新 `materials` 行——磁盘目录始终是
        唯一来源，重扫描会得到同一份事实。三个字段的值都没变时不写文件。
        标签会去空白、去 `#` 前缀并去重；去重后最多 14 个、单个标签最多 24 字（超出 400）。
        标题与描述按**单行**处理（换行折成空格），因为旁车是 `键: 值` 行格式。
      operationId: updateMaterial
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialRequest'
      responses:
        '200':
          description: 更新后的素材详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 客户端生成的请求标识；未提供时由服务端生成。用于贯穿日志、调用追踪与数据库记录。
      schema:
        type: string
        maxLength: 128

  headers:
    RequestId:
      description: 本次请求的标识
      schema:
        type: string

  responses:
    BadRequest:
      description: 请求格式或参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 字段级校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: 依赖不可用（不做降级，直接返回错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: 上游服务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - hotspots
      properties:
        hotspots:
          type: array
          minItems: 1
          maxItems: 10
          description: 热点文本列表（话题句或链接文本均可）
          items:
            type: string
            minLength: 1
            maxLength: 500
        topk:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: 每个热点返回的候选素材数量上限
        clues:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            预设线索快照（S6.7）：与 hotspots **一一对应、等长**；某一项为 null 表示该热点走正常拆解。
            非空的那一项会写进对应 hotspots 行的 clue 并**短路拆解节点**（用户确认/编辑过的标签原样生效，
            不重复付费）。不传时行为与不带该字段完全一致。
          items:
            oneOf:
              - $ref: '#/components/schemas/HotspotClue'
              - type: 'null'

    AnalyzeAccepted:
      type: object
      required:
        - job_id
        - run_id
      properties:
        job_id:
          type: string
          description: 异步任务标识，用于轮询状态
        run_id:
          type: string
          format: uuid
          description: 运行记录标识，用于读取结果与报告

    ImageClueResult:
      type: object
      required:
        - raw_text
        - clue
        - prompt_versions
      properties:
        raw_text:
          type: string
          description: 模型给出的热点描述（≤ 500 字）；用户可编辑后作为 hotspots 提交
        clue:
          $ref: '#/components/schemas/HotspotClue'
        prompt_versions:
          type: object
          description: '本次解析实际使用的 prompt 版本，如 {"image_hotspot_clue": 1}'
          additionalProperties:
            type: integer

    JobStatus:
      type: object
      required:
        - job_id
        - run_id
        - status
        - progress
      properties:
        job_id:
          type: string
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: 0–1 的完成比例
        current_step:
          type: string
          description: 当前所处步骤（拆解 / 检索 / 缺口 / 撰稿 / 报告）
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'

    RunSummary:
      type: object
      required:
        - run_id
        - status
        - created_at
        - hotspot_count
        - hotspot_preview
        - topk
        - totals
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        hotspot_count:
          type: integer
          minimum: 0
        hotspot_preview:
          type: string
          description: 第一条热点的原文预览（超过 60 字截断加省略号）
        topk:
          type: integer
          minimum: 1
          maximum: 20
        totals:
          $ref: '#/components/schemas/RunTotals'
        error:
          oneOf:
            - type: string
            - type: 'null'

    RunList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total:
          type: integer
          minimum: 0

    RunDetail:
      type: object
      required:
        - run_id
        - status
        - created_at
        - totals
        - prompt_versions
        - hotspots
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        totals:
          $ref: '#/components/schemas/RunTotals'
        prompt_versions:
          type: object
          description: 本次运行各任务所用的 prompt 版本；键为 task_id，见 docs/contracts/prompt契约.md
          additionalProperties:
            type: integer
        hotspots:
          type: array
          description: 本次运行中每个热点的分析结果
          items:
            $ref: '#/components/schemas/HotspotResult'

    HotspotResult:
      type: object
      required:
        - hotspot_id
        - hotspot_raw
        - clue
        - coverage
        - candidates
      properties:
        hotspot_id:
          type: string
          format: uuid
        hotspot_raw:
          type: string
        clue:
          $ref: '#/components/schemas/HotspotClue'
        coverage:
          $ref: '#/components/schemas/Coverage'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        draft:
          oneOf:
            - $ref: '#/components/schemas/Draft'
            - type: 'null'

    HotspotClue:
      type: object
      required:
        - why_it_works
        - mechanisms
        - elements
      properties:
        why_it_works:
          type: array
          items:
            type: string
        mechanisms:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              explain:
                type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        match_keywords:
          type: array
          items:
            type: string
        audience:
          type: object
          additionalProperties: true
        borrow_angles:
          type: array
          items:
            type: string
        risk_notes:
          type: array
          items:
            type: string

    Element:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: 爆点要素类型，口径见 docs/产品方案.md 第六节
          enum:
            - ip
            - topic
            - scene
            - visual
            - emotion
            - sound
            - conflict
            - format
            - audience
        value:
          type: string
        weight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.6
        confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        evidence:
          type: string

    Coverage:
      type: object
      required:
        - ratio
        - covered
        - gaps
      properties:
        ratio:
          type: number
          minimum: 0
          maximum: 1
          description: 被素材命中的线索要素权重占比
        covered:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Element'

    MatchCandidate:
      type: object
      required:
        - rank
        - material_id
        - score
        - recall_sources
        - hits
        - missing
        - reasons
        - usage
        - material
      properties:
        rank:
          type: integer
          minimum: 1
        material_id:
          type: string
          format: uuid
        score:
          type: number
          minimum: 0
          maximum: 1
        recall_sources:
          type: array
          description: 该素材由哪些召回通道带回（literal / vector），用于解释排序来源
          items:
            type: string
            enum:
              - literal
              - vector
        hits:
          type: array
          items:
            $ref: '#/components/schemas/MatchHit'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        reasons:
          type: array
          description: 为什么相关；不允许为空，系统不允许出现无理由候选
          minItems: 1
          items:
            type: string
        usage:
          type: string
          description: 建议怎么用（放开头 3 秒 / 当过程画面等）
        material:
          $ref: '#/components/schemas/MaterialSummary'

    MatchHit:
      type: object
      required:
        - element_type
        - clue_value
      properties:
        element_type:
          type: string
          enum:
            - ip
            - topic
            - scene
            - visual
            - emotion
            - sound
            - conflict
            - format
            - audience
        clue_value:
          type: string
        hit_value:
          type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1
        contribution:
          type: number
          minimum: 0
          maximum: 1

    MaterialSummary:
      type: object
      required:
        - id
        - path
        - type
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        keyframes:
          type: array
          items:
            type: string

    MaterialItem:
      type: object
      description: 素材库列表里的一条素材（磁盘目录是唯一来源，这里是索引副本）。
      required:
        - id
        - path
        - type
        - title
        - description
        - tags
        - duration_s
        - width
        - height
        - has_audio
        - size_bytes
        - source
        - keyframes
        - indexed_at
        - dir
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: 素材绝对路径
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        size_bytes:
          type: integer
        source:
          type: string
          enum:
            - sidecar
            - vision
            - filename
            - legacy
        keyframes:
          type: array
          items:
            type: string
        indexed_at:
          type: string
          format: date-time
        dir:
          type: string
          description: 相对素材根目录的父目录（正斜杠；直接放在根目录下时为空串），供前端显示主题

    MaterialDetail:
      type: object
      description: 素材详情：列表项的全部字段 + 爆点要素。
      required:
        - id
        - path
        - type
        - title
        - description
        - tags
        - duration_s
        - width
        - height
        - has_audio
        - size_bytes
        - source
        - keyframes
        - indexed_at
        - dir
        - elements
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
          description: 素材绝对路径
        type:
          type: string
          enum:
            - video
            - image
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        duration_s:
          type: number
        width:
          type: integer
        height:
          type: integer
        has_audio:
          type: boolean
        size_bytes:
          type: integer
        source:
          type: string
          enum:
            - sidecar
            - vision
            - filename
            - legacy
        keyframes:
          type: array
          items:
            type: string
        indexed_at:
          type: string
          format: date-time
        dir:
          type: string
          description: 相对素材根目录的父目录（正斜杠；直接放在根目录下时为空串），供前端显示主题
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'

    UpdateMaterialRequest:
      type: object
      description: |
        `PATCH /api/materials/{material_id}` 请求体：只允许这三个字段（其余一律 422），
        且至少要给一个（否则 400）。未给的字段保持原值。
      additionalProperties: false
      properties:
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string

    MaterialList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
        - dirs
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialItem'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        dirs:
          type: array
          description: 直接子目录及其素材数（受 q / type / source 影响，不受 dir 影响）
          items:
            type: object
            required:
              - path
              - count
            properties:
              path:
                type: string
              count:
                type: integer
                minimum: 0

    Draft:
      type: object
      required:
        - titles
        - body
        - tags
      properties:
        titles:
          type: array
          description: 标题备选，小红书标题上限 20 字
          maxItems: 5
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
                maxLength: 20
              style:
                type: string
        cover_text:
          type: string
        first_3s:
          type: string
        body:
          type: string
        tags:
          type: array
          maxItems: 12
          items:
            type: string
        shot_list:
          type: array
          items:
            type: string
        compliance_notes:
          type: array
          items:
            type: string

    RunTotals:
      type: object
      required:
        - llm_calls
        - prompt_tokens
        - completion_tokens
        - cost_cny
        - latency_ms
      properties:
        llm_calls:
          type: integer
          minimum: 0
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        cost_cny:
          type: number
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0

    Health:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        checks:
          type: object
          required:
            - db
            - redis
            - llm
          properties:
            db:
              $ref: '#/components/schemas/ComponentHealth'
            redis:
              $ref: '#/components/schemas/ComponentHealth'
            llm:
              $ref: '#/components/schemas/ComponentHealth'

    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        detail:
          type: string
        latency_ms:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - bad_request
            - validation_error
            - not_found
            - conflict
            - dependency_unavailable
            - upstream_error
            - internal_error
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
