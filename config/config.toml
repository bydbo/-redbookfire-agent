# 小红书热点搭子 · 默认配置
# 本文件只放可公开的默认值，不存放任何密钥：密钥写 config/.env 或用环境变量覆盖。
# 字段、默认值与取值范围的事实源是 docs/contracts/配置契约.md 第三节；改这里要同步改契约。
# 优先级：环境变量 > config/.env > 本文件 > 代码内默认值。
# 启动前置检查：uv run python -m xhs_agent.probe（配置不合法会以退出码 2 失败）

# 顶层键必须写在第一个表头之前；两项都可用环境变量覆盖（XHS_LOG_LEVEL / XHS_LOG_FORMAT）
log_level = "INFO"
# 日志输出格式：console（本机可读）| json（一行一个 JSON 对象，容器 / CI 与日志检索用）
log_format = "console"

[llm]
# 只支持 OpenAI 兼容端点；auto / offline 的降级语义已取消，缺密钥直接启动失败
provider = "openai_compatible"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"            # 2026-07-24 起 deepseek-chat 已停用；现役名称 deepseek-flash / deepseek-v4-pro
api_key_env = "DEEPSEEK_API_KEY"    # 密钥变量名：值写在 config/.env 或环境变量里，本文件不放密钥
temperature = 0.6
# max_tokens 是**含推理 token 的总输出预算**（completion_tokens = reasoning_tokens + 正文）。
# deepseek-flash 是推理模型：实测同一 prompt 的 reasoning_tokens 在 1.8k–4.1k 之间波动，
# 2000 会被思考量吃光（finish_reason=length，content 为空或被截断）。模型侧上限 393216。
max_tokens = 16000
# 推理耗时随 token 上升（实测单次 10–20 秒），留两倍余量，避免被当成上游错误重试
timeout_s = 120
max_retries = 2
# 成本估算单价（人民币元/百万 token），仅用于成本估算
# 由 DeepSeek deepseek-flash 官方美元价 × 汇率 7.2 折算，取高价时段以免低估
# 高价时段：输入 $0.3、输出 $1.2；低价时段为其一半（$0.15 / $0.6）
price_in_per_m = 2.16
price_out_per_m = 8.64

[vision]
# 多模态打标开关：打开即要求 api_key_env 指向的密钥；E2 接入工作流后再打开
enabled = false
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-vl-max"
api_key_env = "DASHSCOPE_API_KEY"
max_frames = 3
max_width = 720
timeout_s = 60                       # 独立于 [llm].timeout_s，按多模态调用自行设定

[embedding]
# 语义召回：默认启用（向量召回是产品主线）；打开即要求 api_key_env 指向的密钥。
# 换模型必须先补 ADR 并重建向量（《检索契约》§九）。
enabled = true
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "text-embedding-v3"
dim = 1024                          # 必须与数据契约里 materials.embedding 的维度一致
batch_size = 10                     # 客户端按 min(batch_size, 供应商单请求上限=10) 自动拆批
timeout_s = 60
max_retries = 2
# 成本估算单价（人民币元/百万 token），仅用于成本估算
# 2026-10 阿里云百炼 text-embedding-v3 官方价；调价请同步 docs/contracts/配置契约.md §3.3
price_in_per_m = 0.5
api_key_env = "DASHSCOPE_API_KEY"

[retrieval]
# 混合召回参数；口径见 docs/contracts/检索契约.md 第八节
similarity_threshold = 0.3            # word_similarity 语义（ADR 0010）；0.2–0.4 为指标平台区
recall_limit = 50
max_cosine_distance = 0.6            # 向量通道距离阈值；0.7 起接近不过滤（见评测报告扫描表）
rrf_k = 60
w_element = 0.7                     # 与 w_rrf 之和必须为 1
w_rrf = 0.3
hit_threshold = 0.5

[match]
topk = 5
min_score = 0.15

# 覆盖默认要素权重：人物 IP 降到 0.4，体现"借势不直用"的产品规则
[match.element_type_weights]
ip = 0.4

[paths]
# 相对路径均以工程根（本仓库根目录）为基准
materials_dir = "data/materials"
runs_dir = "runs"
index_dir = "runs/_index"

[database]
pool_size = 5
max_overflow = 10
echo = false

[queue]
task_soft_time_limit_s = 600
task_time_limit_s = 900             # 必须 >= task_soft_time_limit_s
max_retries = 2

[frontend]
serve = true                        # 为 true 时要求 dist_dir 存在且非空（preflight 第 7 步，S3.8 落地）
dist_dir = "frontend/dist"
dev_server_url = "http://localhost:5173"
