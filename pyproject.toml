[project]
name = "xhs-agent"
# 版本需与 src/xhs_agent/__init__.py 的 __version__ 保持一致
version = "0.1.0"
description = "蹭点 · 热点相关性 Agent：把热点拆成爆点要素，在本地素材库里找出能蹭上它的镜头"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "tianshugui", email = "tianshugui95@gmail.com" }]
# 运行时保持零第三方依赖，这是本项目的架构承诺，详见 AGENTS.md 第 4 节
dependencies = []

# 开发依赖：仅测试工具
[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
