[project]
name = "xhs-agent"
# 版本需与 src/xhs_agent/__init__.py 的 __version__ 保持一致
version = "0.1.0"
description = "小红书热点搭子 · 热点相关性 Agent：把热点拆成爆点要素，在本地素材库里找出能蹭上它的镜头"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "tianshugui", email = "tianshugui95@gmail.com" }]
# 运行时依赖：pydantic v2（S1.1）、pydantic-settings + python-dotenv（S1.2）。
# 最终技术栈（FastAPI / LangGraph / pgvector 等）见 docs/技术栈.md，引入时走 AGENTS.md 第 6 节
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery>=5.6,<6",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langfuse>=4.16,<5",
    "langgraph>=1.2,<2",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
    "pgvector>=0.5,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "redis>=8,<9",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog>=26.1,<27",
    "uvicorn>=0.54.0",
]

# 开发依赖：测试与代码质量工具
[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "opentelemetry-sdk>=1.45,<2",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pyyaml>=6,<7",
    "ruff>=0.16.9",
    "testcontainers[redis]>=4.15,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 集成测试基座（S2.9）：默认只跑单元用例；集成用例必须显式 `-m integration` 触发
# （命令行给的 -m 会覆盖这里的 addopts），因此默认跑测试不需要 Docker。
addopts = "-m 'not integration'"
markers = ["integration: 需要 Docker 的集成用例（testcontainers 起真实 Postgres / Redis）"]
# pytest-asyncio（严格模式，异步用例显式打标记）：容器与 engine 是 session 级，
# 让测试与夹具共用同一个事件循环，避免 asyncpg 连接跨 loop 报错。
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# 覆盖率（S1.5）：`uv run pytest --cov` 即可出报告。
# source 用包名而不是目录清单，后续新增 models/、db/、api/ 等会自动纳入统计。
# 按 backlog 不设 fail_under（门槛留到 CI，见 S4.5）；show_missing 直接给未覆盖行号。
[tool.coverage.run]
source = ["xhs_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# 覆盖率门槛（S4.5 起进 CI）：当前单测覆盖 81%，留 3 个点余量避免小重构踩线。
# 只在带 --cov 的跑法下生效（CI 的 test job）；本地 `uv run pytest` 与 pre-commit 钩子不带
# --cov，所以提交仍然是快的。改这个数字时同步 tests/unit/test_ci_workflow.py 的断言。
fail_under = 78

# 代码质量门（S1.3）：规则集显式写死，避免 ruff 默认集随版本漂移。
# 本次不启用 ruff format；formatter 与 line-length 留到单独一次提交（docs/backlog.md S1.3）。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM"]

# mypy 严格模式先覆盖新代码。pydantic 插件是必需的：否则 Field(default_factory=Model)
# 会误报，pydantic-settings 的 _env_file 这类初始化参数也解析不了。
# 存量 tools/、util.py 与 tests/ 逐阶段收紧，见 docs/backlog.md S1.3。
[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = [
    "src/xhs_agent/schemas.py",
    "src/xhs_agent/config.py",
    "src/xhs_agent/probe.py",
    # S3.8 的推荐启动入口（先 preflight 再起 uvicorn）
    "src/xhs_agent/serve.py",
    # E2 新增的 db / services / 检索与向量化工具——async + ORM + SQL 交互，类型风险最高
    "src/xhs_agent/db",
    "src/xhs_agent/services",
    "src/xhs_agent/tools/retrieval.py",
    "src/xhs_agent/tools/embedding.py",
    "src/xhs_agent/tools/prompt.py",
    # S3.5 把模型调用层与 agents 改成异步 httpx——对外错误与重试口径的核心
    "src/xhs_agent/tools/llm.py",
    "src/xhs_agent/tools/http.py",
    "src/xhs_agent/agents",
    # S3.4a 改写了运行记录落盘（停写 state.json）——运行产物与事件流的核心，纳入严格范围
    "src/xhs_agent/tools/trace.py",
    # E3 新增的 HTTP 层与核心层（S3.2）：对外错误语义与请求上下文，类型错误代价高
    "src/xhs_agent/api",
    "src/xhs_agent/core",
    # S3.4b 的 Celery 任务层：投递、重试与失败路径都在这里，类型错误代价高
    "src/xhs_agent/tasks",
]

# Celery / kombu 都没有 py.typed（也没有官方 stubs），严格模式下只能放行"缺类型"，
# 放行范围仅限这两个包；本仓库自己的代码仍走 strict。
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
