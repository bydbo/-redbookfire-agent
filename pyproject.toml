[project]
name = "xhs-agent"
# 版本需与 src/xhs_agent/__init__.py 的 __version__ 保持一致
version = "0.1.0"
description = "小红书热点搭子 · 热点相关性 Agent：把热点拆成爆点要素，在本地素材库里找出能蹭上它的镜头"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "tianshugui", email = "tianshugui95@gmail.com" }]
# 运行时依赖：pydantic v2（S1.1 引入）。最终技术栈（FastAPI / LangGraph / pgvector 等）见 docs/技术栈.md，引入时走 AGENTS.md 第 6 节
dependencies = [
    "pydantic>=2.9,<3",
]

# 开发依赖：测试与代码质量工具
[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
